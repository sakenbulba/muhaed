<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Pure Spiking Neural Network (SNN) Fly Engine</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; overflow: hidden; background: #020617; font-family: -apple-system, BlinkMacSystemFont, monospace; color: #38bdf8; user-select: none; }
    #canvas-container { width: 100vw; height: 100vh; touch-action: none; }
    
    #telemetry {
      position: absolute; top: 12px; left: 12px; z-index: 100;
      background: rgba(15, 23, 42, 0.85); padding: 14px; border-radius: 16px;
      border: 1px solid rgba(56, 189, 248, 0.25); font-size: 11px; line-height: 1.5;
      max-width: 320px; pointer-events: none; backdrop-filter: blur(12px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
    }

    .meter-bar { width: 100%; background: rgba(2, 6, 23, 0.9); height: 6px; border-radius: 3px; margin: 2px 0 6px; overflow: hidden; border: 1px solid rgba(255,255,255,0.05); }
    .meter-fill { height: 100%; background: linear-gradient(90deg, #0284c7, #38bdf8); width: 0%; transition: width 0.05s; }

    #ui-container {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 8px; z-index: 100; padding: 6px;
      background: rgba(15, 23, 42, 0.85); border-radius: 16px;
      border: 1px solid rgba(56, 189, 248, 0.25); backdrop-filter: blur(12px);
    }
    .btn {
      background: rgba(30, 41, 59, 0.7); border: 1px solid rgba(56, 189, 248, 0.3); color: #f8fafc;
      padding: 10px 14px; border-radius: 10px; font-weight: 600; font-size: 11px;
      cursor: pointer; transition: all 0.2s;
    }
    .btn.active { background: #0284c7; border-color: #38bdf8; box-shadow: 0 0 12px rgba(2, 132, 199, 0.6); }
  </style>
</head>
<body>

  <div id="telemetry">
    <div style="font-size: 12px; font-weight: bold; color: #fff; margin-bottom: 4px;">🧠 PURE LIF SNN ENGINE (NO IF-ELSE CONTROL)</div>
    <div style="opacity: 0.6; font-size: 9px; margin-bottom: 8px;">EMERGENT STEERING VIA LEAKY INTEGRATE-AND-FIRE</div>
    
    ⚡ Частота спайков (Spikes/s): <b id="spike-rate" style="color:#38bdf8;">0</b><br>
    
    📡 Sensory Input L / R (Current I_ext):
    <div class="meter-bar"><div id="sensory-l-fill" class="meter-fill" style="background: #22c55e;"></div></div>
    <div class="meter-bar"><div id="sensory-r-fill" class="meter-fill" style="background: #a855f7;"></div></div>

    🪽 Motor Spike Rate L / R:
    <div class="meter-bar"><div id="motor-l-fill" class="meter-fill" style="background:#0284c7;"></div></div>
    <div class="meter-bar"><div id="motor-r-fill" class="meter-fill" style="background:#38bdf8;"></div></div>

    📍 Режим SNN: <span id="flight-status" style="color:#38bdf8; font-weight:bold;">Emergent Flight Dynamics</span>
  </div>

  <div id="canvas-container"></div>

  <div id="ui-container">
    <button class="btn active" id="btn-food" onclick="selectTool('food')">🍕 Сахар</button>
    <button class="btn" id="btn-threat" onclick="selectTool('threat')">💥 Опасность</button>
    <button class="btn" id="btn-wall" onclick="selectTool('wall')">🧱 Барьер</button>
    <button class="btn" onclick="clearObjects()">🧹 Очистить</button>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    let scene, camera, renderer, clock;
    let flyMesh, leftWing, rightWing;
    let brainHologram, brainParticles, brainGeo;
    let floorPlane, raycaster, mouse = new THREE.Vector2();
    let objects = []; 
    let currentTool = 'food';

    let flyPos = new THREE.Vector3(0, 2.0, 0);
    let flyVel = new THREE.Vector3(0, 0, 0);
    let flyRotY = 0, flyPitch = 0, flyRoll = 0;

    let isDragging = false, prevMouseX = 0, prevMouseY = 0;
    let camRadius = 11, camTheta = Math.PI / 4, camPhi = Math.PI / 3;

    // ==========================================
    // 🧠 PURE LEAKY INTEGRATE-AND-FIRE (LIF) SNN
    // ==========================================
    const TOTAL_NEURONS = 8000;
    const SYNAPSE_COUNT = 40000;

    // Индексы анатомических популяций
    const SENSORY_L_START = 0,    SENSORY_L_END = 999;
    const SENSORY_R_START = 1000, SENSORY_R_END = 1999;
    const CX_START        = 2000, CX_END        = 5999;
    const MN_L_START      = 6000, MN_L_END      = 6999;
    const MN_R_START      = 7000, MN_R_END      = 7999;

    // LIF параметры
    const V_REST = -70.0, V_THRESH = -50.0, V_RESET = -75.0, DECAY = 0.85;

    let V = new Float32Array(TOTAL_NEURONS);
    let I_ext = new Float32Array(TOTAL_NEURONS);
    let lastSpikeTime = new Float32Array(TOTAL_NEURONS);
    
    let synFrom = new Int32Array(SYNAPSE_COUNT);
    let synTo = new Int32Array(SYNAPSE_COUNT);
    let synWeight = new Float32Array(SYNAPSE_COUNT);

    let spikeCounts = { sensoryL: 0, sensoryR: 0, motorL: 0, motorR: 0 };
    let neuronSpikedThisFrame = new Uint8Array(TOTAL_NEURONS);

    function initPureConnectome() {
      let synIdx = 0;

      function connectPopulations(srcStart, srcEnd, dstStart, dstEnd, meanWeight, count) {
        for (let c = 0; c < count && synIdx < SYNAPSE_COUNT; c++) {
          let src = srcStart + Math.floor(Math.random() * (srcEnd - srcStart));
          let dst = dstStart + Math.floor(Math.random() * (dstEnd - dstStart));
          synFrom[synIdx] = src;
          synTo[synIdx] = dst;
          synWeight[synIdx] = meanWeight + (Math.random() - 0.5) * 1.0;
          synIdx++;
        }
      }

      // Прямые возбуждающие синапсы от левого сенсора к правому мотору и наоборот (перекрестная топология Braitenberg Vehicle)
      connectPopulations(SENSORY_L_START, SENSORY_L_END, MN_R_START, MN_R_END, 3.8, 8000);
      connectPopulations(SENSORY_R_START, SENSORY_R_END, MN_L_START, MN_L_END, 3.8, 8000);

      // Прямые возбуждающие связи (для уклонения и балансировки)
      connectPopulations(SENSORY_L_START, SENSORY_L_END, MN_L_START, MN_L_END, 1.2, 4000);
      connectPopulations(SENSORY_R_START, SENSORY_R_END, MN_R_START, MN_R_END, 1.2, 4000);

      // Связи с интернейронами Central Complex (CX) для поддержания фоновой активности и памяти
      connectPopulations(SENSORY_L_START, SENSORY_L_END, CX_START, CX_END, 2.0, 5000);
      connectPopulations(SENSORY_R_START, SENSORY_R_END, CX_START, CX_END, 2.0, 5000);
      connectPopulations(CX_START, CX_END, MN_L_START, MN_L_END, 2.5, 5000);
      connectPopulations(CX_START, CX_END, MN_R_START, MN_R_END, 2.5, 5000);

      // Латеральное торможение внутри CX
      connectPopulations(CX_START, CX_END, CX_START, CX_END, -1.5, 4000);

      for (let i = 0; i < TOTAL_NEURONS; i++) {
        V[i] = V_REST + (Math.random() - 0.5) * 5.0;
        lastSpikeTime[i] = -999;
      }
    }

    // Чистый математический шаг LIF спайковой нейронной сети
    function stepSNN(currentTime) {
      neuronSpikedThisFrame.fill(0);
      spikeCounts.sensoryL = 0; spikeCounts.sensoryR = 0;
      spikeCounts.motorL = 0; spikeCounts.motorR = 0;
      let totalSpikes = 0;

      // 1. Интегрирование мембранного потенциала
      for (let i = 0; i < TOTAL_NEURONS; i++) {
        V[i] = V_REST + (V[i] - V_REST) * DECAY + I_ext[i];
        I_ext[i] = 0; // Сброс внешнего тока
      }

      // 2. Генерация спайков (Порог V_THRESH)
      for (let i = 0; i < TOTAL_NEURONS; i++) {
        if (V[i] >= V_THRESH) {
          V[i] = V_RESET;
          lastSpikeTime[i] = currentTime;
          neuronSpikedThisFrame[i] = 1;
          totalSpikes++;

          if (i <= SENSORY_L_END) spikeCounts.sensoryL++;
          else if (i <= SENSORY_R_END) spikeCounts.sensoryR++;
          else if (i >= MN_L_START && i <= MN_L_END) spikeCounts.motorL++;
          else if (i >= MN_R_START && i <= MN_R_END) spikeCounts.motorR++;
        }
      }

      // 3. Синаптическая передача сигналов и STDP пластичность
      for (let k = 0; k < SYNAPSE_COUNT; k++) {
        let src = synFrom[k];
        let dst = synTo[k];

        if (neuronSpikedThisFrame[src]) {
          I_ext[dst] += synWeight[k]; // Входной ток на постсинаптический нейрон

          // STDP пластичность (Spike-Timing-Dependent Plasticity)
          let dt = currentTime - lastSpikeTime[dst];
          if (dt > 0 && dt < 0.02) {
            synWeight[k] = Math.min(6.0, synWeight[k] + 0.02);
          }
        }
      }

      return totalSpikes;
    }

    function selectTool(tool) {
      currentTool = tool;
      document.querySelectorAll('#ui-container .btn').forEach(b => b.classList.remove('active'));
      document.getElementById(`btn-${tool}`).classList.add('active');
    }

    // ==========================================
    // 🎨 THREE.JS ВИЗУАЛИЗАЦИЯ
    // ==========================================
    function init() {
      const container = document.getElementById('canvas-container');
      clock = new THREE.Clock();
      raycaster = new THREE.Raycaster();

      scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x020617, 0.035);

      camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
      updateCameraPosition();

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      container.appendChild(renderer.domElement);

      scene.add(new THREE.AmbientLight(0x1e293b, 1.2));

      const dirLight = new THREE.DirectionalLight(0x38bdf8, 2.2);
      dirLight.position.set(10, 20, 10);
      dirLight.castShadow = true;
      scene.add(dirLight);

      const floorMat = new THREE.MeshStandardMaterial({ color: 0x030712, roughness: 0.5, metalness: 0.4 });
      floorPlane = new THREE.Mesh(new THREE.PlaneGeometry(32, 32), floorMat);
      floorPlane.rotation.x = -Math.PI / 2;
      floorPlane.receiveShadow = true;
      scene.add(floorPlane);

      const grid = new THREE.GridHelper(32, 32, 0x0284c7, 0x0f172a);
      grid.position.y = 0.01;
      scene.add(grid);

      buildDetailedFly();
      buildSNNBrainParticles();
      initPureConnectome();

      spawnObject('food', new THREE.Vector3(3, 0, 3));
      spawnObject('threat', new THREE.Vector3(-3, 0, -2));

      container.addEventListener('pointerdown', onPointerDown);
      container.addEventListener('pointermove', onPointerMove);
      container.addEventListener('pointerup', () => isDragging = false);
      window.addEventListener('resize', onWindowResize);

      animate();
    }

    function buildDetailedFly() {
      const group = new THREE.Group();
      const bodyMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.2, metalness: 0.8 });
      const eyeMat = new THREE.MeshStandardMaterial({ color: 0xd97706, roughness: 0.1 });
      const wingMat = new THREE.MeshPhysicalMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.6, transmission: 0.8 });

      const thorax = new THREE.Mesh(new THREE.SphereGeometry(0.32, 16, 16), bodyMat);
      thorax.scale.set(0.85, 0.75, 1.1);
      group.add(thorax);

      const abdomen = new THREE.Mesh(new THREE.SphereGeometry(0.4, 16, 16), bodyMat);
      abdomen.position.set(0, -0.05, -0.6);
      abdomen.scale.set(0.8, 0.7, 1.4);
      group.add(abdomen);

      const eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.15, 12, 12), eyeMat);
      eyeL.position.set(-0.16, 0.08, 0.25);
      const eyeR = eyeL.clone(); eyeR.position.x = 0.16;
      group.add(eyeL); group.add(eyeR);

      const wingGeo = new THREE.BoxGeometry(0.45, 0.005, 0.8);
      wingGeo.translate(0.22, 0, -0.35);
      leftWing = new THREE.Mesh(wingGeo, wingMat);
      leftWing.position.set(-0.08, 0.2, -0.1);
      rightWing = new THREE.Mesh(wingGeo, wingMat);
      rightWing.position.set(0.08, 0.2, -0.1);
      rightWing.scale.x = -1;

      group.add(leftWing); group.add(rightWing);
      flyMesh = group;
      scene.add(flyMesh);
    }

    function buildSNNBrainParticles() {
      brainHologram = new THREE.Group();
      const positions = new Float32Array(TOTAL_NEURONS * 3);
      const colors = new Float32Array(TOTAL_NEURONS * 3);

      for (let i = 0; i < TOTAL_NEURONS; i++) {
        let x = 0, y = 0, z = 0;

        if (i <= SENSORY_L_END) {
          x = -0.25 + (Math.random() - 0.5) * 0.15;
          y = (Math.random() - 0.5) * 0.15;
          z = 0.2 + Math.random() * 0.15;
        } else if (i <= SENSORY_R_END) {
          x = 0.25 + (Math.random() - 0.5) * 0.15;
          y = (Math.random() - 0.5) * 0.15;
          z = 0.2 + Math.random() * 0.15;
        } else if (i <= CX_END) {
          x = (Math.random() - 0.5) * 0.3;
          y = (Math.random() - 0.5) * 0.2;
          z = (Math.random() - 0.5) * 0.2;
        } else {
          let side = i <= MN_L_END ? -1 : 1;
          x = side * 0.2 + (Math.random() - 0.5) * 0.1;
          y = (Math.random() - 0.5) * 0.15;
          z = -0.2 - Math.random() * 0.15;
        }

        positions[i * 3]     = x;
        positions[i * 3 + 1] = y;
        positions[i * 3 + 2] = z;

        colors[i * 3]     = 0.05;
        colors[i * 3 + 1] = 0.15;
        colors[i * 3 + 2] = 0.3;
      }

      brainGeo = new THREE.BufferGeometry();
      brainGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      brainGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

      const mat = new THREE.PointsMaterial({ 
        size: 0.04, 
        vertexColors: true, 
        transparent: true, 
        opacity: 0.9,
        blending: THREE.AdditiveBlending 
      });
      
      brainParticles = new THREE.Points(brainGeo, mat);
      brainHologram.add(brainParticles);
      scene.add(brainHologram);
    }

    function spawnObject(type, pos) {
      const parentGroup = new THREE.Group();
      parentGroup.position.copy(pos);

      if (type === 'food') {
        const crystalMat = new THREE.MeshStandardMaterial({ color: 0x22c55e, emissive: 0x15803d, emissiveIntensity: 0.5 });
        const m = new THREE.Mesh(new THREE.DodecahedronGeometry(0.3), crystalMat);
        m.position.y = 0.3;
        parentGroup.add(m);
      } else if (type === 'threat') {
        const coreMat = new THREE.MeshStandardMaterial({ color: 0xef4444, emissive: 0xd97706, emissiveIntensity: 0.8 });
        const core = new THREE.Mesh(new THREE.IcosahedronGeometry(0.35, 0), coreMat);
        core.position.y = 0.4;
        parentGroup.add(core);
      } else {
        const wallMat = new THREE.MeshStandardMaterial({ color: 0x334155 });
        const wall = new THREE.Mesh(new THREE.BoxGeometry(2.5, 1.2, 0.3), wallMat);
        wall.position.y = 0.6;
        parentGroup.add(wall);
      }

      parentGroup.userData = { type: type };
      scene.add(parentGroup);
      objects.push(parentGroup);
    }

    function clearObjects() {
      objects.forEach(obj => scene.remove(obj));
      objects = [];
    }

    function onPointerDown(e) {
      isDragging = true;
      prevMouseX = e.clientX; prevMouseY = e.clientY;

      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);

      const intersects = raycaster.intersectObject(floorPlane);
      if (intersects.length > 0 && e.clientY < window.innerHeight - 80) {
        spawnObject(currentTool, intersects[0].point);
      }
    }

    function onPointerMove(e) {
      if (!isDragging) return;
      let deltaX = e.clientX - prevMouseX;
      let deltaY = e.clientY - prevMouseY;
      if (Math.abs(deltaX) > 2 || Math.abs(deltaY) > 2) {
        camTheta -= deltaX * 0.005;
        camPhi = Math.max(0.2, Math.min(Math.PI / 2 - 0.05, camPhi - deltaY * 0.005));
        prevMouseX = e.clientX; prevMouseY = e.clientY;
        updateCameraPosition();
      }
    }

    function updateCameraPosition() {
      camera.position.x = flyPos.x + camRadius * Math.sin(camPhi) * Math.cos(camTheta);
      camera.position.y = flyPos.y + camRadius * Math.cos(camPhi);
      camera.position.z = flyPos.z + camRadius * Math.sin(camPhi) * Math.sin(camTheta);
      camera.lookAt(flyPos.x, flyPos.y + 0.2, flyPos.z);
    }

    // ==========================================
    // 🔄 ЧИСТЫЙ СИМУЛЯЦИОННЫЙ ЦИКЛ (SNN DRIVE)
    // ==========================================
    function animate() {
      requestAnimationFrame(animate);
      const delta = Math.min(clock.getDelta(), 0.05);
      const time = clock.getElapsedTime();

      // 1. Подача фонового шума в сеть (Биологический тонус / Поисковый драйв)
      for (let i = 0; i < 50; i++) {
        let randNeuron = Math.floor(Math.random() * TOTAL_NEURONS);
        I_ext[randNeuron] += Math.random() * 12.0;
      }

      // 2. Без "IF-ELSE": Скалярное произведение превращает угол и расстояние в электрический ток I_ext
      let flyDir = new THREE.Vector3(Math.sin(flyRotY), 0, Math.cos(flyRotY));
      let flyLeftDir = new THREE.Vector3().crossVectors(flyDir, new THREE.Vector3(0, 1, 0)).negate();
      let flyRightDir = flyLeftDir.clone().negate();

      let currentSensoryL = 0, currentSensoryR = 0;

      objects.forEach(obj => {
        let toObj = new THREE.Vector3().subVectors(obj.position, flyPos);
        let dist = toObj.length();

        if (dist < 10.0) {
          toObj.normalize();
          let weight = obj.userData.type === 'threat' ? -2.5 : 1.5; // Опасность даёт торможение/обратную фазу

          // Проекция вектора объекта на левый и правый глаз мухи
          let leftStimulus = Math.max(0, flyLeftDir.dot(toObj)) * (10.0 - dist) * 4.0 * weight;
          let rightStimulus = Math.max(0, flyRightDir.dot(toObj)) * (10.0 - dist) * 4.0 * weight;

          currentSensoryL += Math.abs(leftStimulus);
          currentSensoryR += Math.abs(rightStimulus);

          // Подача входа напрямую как непрерывный ток $I_{ext}$ на сенсорные популяционные нейроны
          for (let i = SENSORY_L_START; i <= SENSORY_L_END; i += 10) I_ext[i] += leftStimulus;
          for (let i = SENSORY_R_START; i <= SENSORY_R_END; i += 10) I_ext[i] += rightStimulus;
        }
      });

      // 3. Выполнение чистого шага LIF SNN
      let totalSpikes = stepSNN(time);

      // 4. Физика полета — полностью производное значение от частоты разряда моторных нейронов
      let thrustL = spikeCounts.motorL * 0.005;
      let thrustR = spikeCounts.motorR * 0.005;

      // Руление (Yaw) определяется напрямую разностью нейронных спайков: Rate(MN_L) - Rate(MN_R)
      let angularVelocity = (thrustL - thrustR) * 1.8;
      flyRotY += angularVelocity * delta * 10;

      let forwardThrust = (thrustL + thrustR) * 0.5;

      // Векторы движения
      flyVel.x += Math.sin(flyRotY) * forwardThrust * delta * 8;
      flyVel.z += Math.cos(flyRotY) * forwardThrust * delta * 8;
      flyVel.y += (forwardThrust - 0.1) * delta * 4;

      flyVel.multiplyScalar(0.91); // Трение воздуха
      flyPos.add(flyVel);

      // Границы
      flyPos.y = Math.max(0.4, Math.min(6.5, flyPos.y));
      flyPos.x = Math.max(-14, Math.min(14, flyPos.x));
      flyPos.z = Math.max(-14, Math.min(14, flyPos.z));

      // Крен и тангаж зависят только от асимметрии работы двигательных нейронов
      flyRoll = -angularVelocity * 2.0;
      flyPitch = -flyVel.y * 1.5;

      flyMesh.position.copy(flyPos);
      flyMesh.rotation.set(flyPitch, flyRotY, flyRoll);

      // Частота взмахов крыльев управляется прямо от спайков моторных нейронов
      let wingFreq = 20 + forwardThrust * 100;
      leftWing.rotation.y = Math.sin(time * wingFreq) * (0.3 + thrustL);
      rightWing.rotation.y = -Math.sin(time * wingFreq) * (0.3 + thrustR);

      // 5. Отрисовка 3D спайков на голограмме
      brainHologram.position.copy(flyPos);
      brainHologram.position.y += 0.95;
      brainHologram.rotation.y = flyRotY;

      const colorsArr = brainGeo.attributes.color.array;

      for (let i = 0; i < TOTAL_NEURONS; i++) {
        if (neuronSpikedThisFrame[i]) {
          if (i <= SENSORY_R_END) {
            colorsArr[i * 3]     = 0.2;
            colorsArr[i * 3 + 1] = 1.0;
            colorsArr[i * 3 + 2] = 0.4;
          } else if (i <= CX_END) {
            colorsArr[i * 3]     = 1.0;
            colorsArr[i * 3 + 1] = 0.2;
            colorsArr[i * 3 + 2] = 0.4;
          } else {
            colorsArr[i * 3]     = 0.1;
            colorsArr[i * 3 + 1] = 0.7;
            colorsArr[i * 3 + 2] = 1.0;
          }
        } else {
          colorsArr[i * 3]     *= 0.82;
          colorsArr[i * 3 + 1] *= 0.82;
          colorsArr[i * 3 + 2] = Math.max(0.15, colorsArr[i * 3 + 2] * 0.92);
        }
      }
      brainGeo.attributes.color.needsUpdate = true;

      updateCameraPosition();

      // UI
      document.getElementById('spike-rate').innerText = totalSpikes.toLocaleString();
      document.getElementById('sensory-l-fill').style.width = `${Math.min(100, currentSensoryL * 3)}%`;
      document.getElementById('sensory-r-fill').style.width = `${Math.min(100, currentSensoryR * 3)}%`;
      document.getElementById('motor-l-fill').style.width = `${Math.min(100, spikeCounts.motorL * 3)}%`;
      document.getElementById('motor-r-fill').style.width = `${Math.min(100, spikeCounts.motorR * 3)}%`;

      document.getElementById('flight-status').innerText = Math.abs(angularVelocity) > 0.05 
        ? (angularVelocity > 0 ? "🔄 Спайковое руление Влево" : "🔄 Спайковое руление Вправо") 
        : "✈️ Прямой полёт (SNN)";

      renderer.render(scene, camera);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    window.onload = init;
  </script>
</body>
</html>
