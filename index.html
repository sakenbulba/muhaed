<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Ultimate Fly 3D Sandbox</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    * { touch-action: none; user-select: none; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; overflow: hidden; background: #1a1e29; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: white; }
    #canvas-container { width: 100vw; height: 100vh; }
    
    /* Панель управления под Android */
    #ui {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 8px; background: rgba(26, 32, 48, 0.92);
      padding: 10px 14px; border-radius: 20px; backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15); max-width: 92vw; overflow-x: auto;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }
    
    .btn {
      background: #2a324b; border: 1px solid #3d486b; color: white;
      padding: 12px 16px; border-radius: 14px; font-size: 13px; font-weight: 700;
      display: flex; align-items: center; gap: 6px; cursor: pointer; white-space: nowrap;
      transition: all 0.1s ease;
    }
    .btn:active { transform: scale(0.95); }
    .btn.active { background: #3b82f6; border-color: #60a5fa; }
    .btn-shock { border-color: #ef4444; } .btn-shock.active { background: #dc2626; }
    .btn-spray { border-color: #a855f7; } .btn-spray.active { background: #9333ea; }
    .btn-magnet { border-color: #f97316; } .btn-magnet.active { background: #ea580c; }

    #status {
      position: absolute; top: 15px; left: 15px;
      background: rgba(15, 23, 42, 0.85); padding: 8px 14px; border-radius: 12px;
      font-size: 12px; font-weight: 600; border: 1px solid rgba(255,255,255,0.1);
      letter-spacing: 0.5px; backdrop-filter: blur(8px);
    }
  </style>
</head>
<body>

  <div id="status">🧠 МУХА: 1 | HP: 100%</div>
  <div id="canvas-container"></div>

  <div id="ui">
    <button class="btn active" id="btn-touch" onclick="setMode('touch')">👈 Толкать</button>
    <button class="btn btn-shock" id="btn-shock" onclick="setMode('shock')">⚡ Шокер</button>
    <button class="btn btn-spray" id="btn-spray" onclick="setMode('spray')">💨 Спрей</button>
    <button class="btn btn-magnet" id="btn-magnet" onclick="setMode('magnet')">🧲 Магнит</button>
    <button class="btn" onclick="respawnFly()">🔄 Респавн</button>
    <button class="btn" onclick="spawnFly()">🪰 +1 Муха</button>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    let scene, camera, renderer, clock;
    let flies = [];
    let currentMode = 'touch';
    let pointerPos = new THREE.Vector3();
    let effectParticles = null;

    // Звуковой движок (Web Audio API)
    let audioCtx = null;
    let buzzOsc = null, buzzGain = null;

    function initAudio() {
      if (audioCtx) return;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      
      // Генератор жужжания
      buzzOsc = audioCtx.createOscillator();
      buzzGain = audioCtx.createGain();
      buzzOsc.type = 'sawtooth';
      buzzOsc.frequency.setValueAtTime(150, audioCtx.currentTime); // Базовая частота крыльев
      buzzGain.gain.setValueAtTime(0.02, audioCtx.currentTime);
      buzzOsc.connect(buzzGain);
      buzzGain.connect(audioCtx.destination);
      buzzOsc.start();
    }

    function playShockSound() {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'square';
      osc.frequency.setValueAtTime(300 + Math.random() * 500, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.15);
    }

    function init() {
      const container = document.getElementById('canvas-container');
      clock = new THREE.Clock();

      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x1a1e29); // Светлый контрастный фон
      scene.fog = new THREE.FogExp2(0x1a1e29, 0.02);

      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 0, 12); // Расширенная камера

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      container.appendChild(renderer.domElement);

      // Освещение сцены
      scene.add(new THREE.AmbientLight(0xffffff, 0.7));
      const mainLight = new THREE.DirectionalLight(0xffffff, 1.0);
      mainLight.position.set(5, 12, 8);
      scene.add(mainLight);

      // Добавляем сетку-ориентир на задний план
      const grid = new THREE.GridHelper(30, 30, 0x3b82f6, 0x2a324b);
      grid.rotation.x = Math.PI / 2;
      grid.position.z = -5;
      scene.add(grid);

      spawnFly();

      window.addEventListener('pointerdown', (e) => { initAudio(); handlePointer(e); });
      window.addEventListener('pointermove', (e) => { if (e.buttons > 0) handlePointer(e); });
      window.addEventListener('resize', onWindowResize);

      animate();
    }

    // Правильная анатомическая 3D-модель мухи
    function buildCorrectFly() {
      const flyGroup = new THREE.Group();

      const bodyMat = new THREE.MeshStandardMaterial({ color: 0x111115, roughness: 0.4, metalness: 0.6 });
      const eyeMat = new THREE.MeshStandardMaterial({ color: 0xb91c1c, roughness: 0.2, metalness: 0.1 });
      const wingMat = new THREE.MeshPhysicalMaterial({
        color: 0xe0f2fe, transmission: 0.85, transparent: true, opacity: 0.7, roughness: 0.1
      });

      // 1. Брюшко (сзади)
      const abdomen = new THREE.Mesh(new THREE.SphereGeometry(0.5, 16, 16), bodyMat);
      abdomen.scale.set(0.9, 0.8, 1.4);
      abdomen.position.set(0, 0, -0.6);
      flyGroup.add(abdomen);

      // 2. Грудь (центр)
      const thorax = new THREE.Mesh(new THREE.SphereGeometry(0.45, 16, 16), bodyMat);
      thorax.position.set(0, 0, 0);
      flyGroup.add(thorax);

      // 3. Голова (спереди)
      const head = new THREE.Mesh(new THREE.SphereGeometry(0.3, 16, 16), bodyMat);
      head.position.set(0, 0, 0.5);
      flyGroup.add(head);

      // 4. Большие фасеточные глаза (по бокам головы)
      const eyeGeo = new THREE.SphereGeometry(0.2, 12, 12);
      const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
      leftEye.position.set(-0.22, 0.1, 0.55);
      const rightEye = leftEye.clone();
      rightEye.position.x = 0.22;
      flyGroup.add(leftEye);
      flyGroup.add(rightEye);

      // 5. Крылья (Крепятся к груди СВЕРХУ)
      const wingGeo = new THREE.BoxGeometry(0.7, 0.01, 1.2);
      wingGeo.translate(0.35, 0, -0.5); // Центр вращения у основания крыла

      const leftWing = new THREE.Mesh(wingGeo, wingMat);
      leftWing.position.set(-0.1, 0.35, 0);
      
      const rightWing = new THREE.Mesh(wingGeo, wingMat);
      rightWing.position.set(0.1, 0.35, 0);
      rightWing.scale.x = -1; // Зеркальное крыло

      flyGroup.add(leftWing);
      flyGroup.add(rightWing);

      return {
        mesh: flyGroup,
        leftWing: leftWing,
        rightWing: rightWing,
        pos: new THREE.Vector3(0, 0, 0),
        vel: new THREE.Vector3(),
        hp: 100,
        isShocked: false,
        shockTimer: 0
      };
    }

    function spawnFly() {
      const flyData = buildCorrectFly();
      flyData.pos.set((Math.random() - 0.5) * 4, (Math.random() - 0.5) * 4, 0);
      scene.add(flyData.mesh);
      flies.push(flyData);
    }

    function respawnFly() {
      if (navigator.vibrate) navigator.vibrate(50);
      flies.forEach(f => scene.remove(f.mesh));
      flies = [];
      spawnFly();
    }

    function setMode(mode) {
      currentMode = mode;
      if (navigator.vibrate) navigator.vibrate(30);
      document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
      document.getElementById(`btn-${mode}`).classList.add('active');
    }

    function handlePointer(e) {
      if (e.clientY > window.innerHeight - 80) return;

      const vec = new THREE.Vector3(
        (e.clientX / window.innerWidth) * 2 - 1,
        -(e.clientY / window.innerHeight) * 2 + 1, 0.5
      );
      vec.unproject(camera);
      const dir = vec.sub(camera.position).normalize();
      const dist = -camera.position.z / dir.z;
      pointerPos = camera.position.clone().add(dir.multiplyScalar(dist));

      flies.forEach(fly => {
        const d = fly.pos.distanceTo(pointerPos);

        if (currentMode === 'touch' && d < 3.0) {
          const force = fly.pos.clone().sub(pointerPos).normalize().multiplyScalar(7.0);
          fly.vel.add(force);
        } else if (currentMode === 'shock' && d < 3.5) {
          fly.isShocked = true;
          fly.shockTimer = 1.2;
          fly.hp -= 12;
          playShockSound();
          createLightning(pointerPos, fly.pos);
        } else if (currentMode === 'spray' && d < 4.0) {
          fly.hp -= 1.0;
          fly.vel.add(new THREE.Vector3((Math.random()-0.5)*1.5, -1.0, 0));
        } else if (currentMode === 'magnet') {
          const pull = pointerPos.clone().sub(fly.pos).normalize().multiplyScalar(4.5);
          fly.vel.add(pull);
        }
      });
    }

    function createLightning(p1, p2) {
      if (effectParticles) scene.remove(effectParticles);
      const geo = new THREE.BufferGeometry();
      const mid = new THREE.Vector3().addVectors(p1, p2).multiplyScalar(0.5).add(
        new THREE.Vector3((Math.random()-0.5)*1.5, (Math.random()-0.5)*1.5, 0)
      );
      geo.setFromPoints([p1, mid, p2]);
      const mat = new THREE.LineBasicMaterial({ color: 0x38bdf8, linewidth: 4 });
      effectParticles = new THREE.Line(geo, mat);
      scene.add(effectParticles);
      setTimeout(() => { if (effectParticles) scene.remove(effectParticles); }, 80);
    }

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      const time = clock.getElapsedTime();

      flies.forEach((fly, index) => {
        if (fly.hp <= 0) {
          fly.vel.y = -6.0; // Смертельное падение
          fly.mesh.rotation.x = Math.PI;
        } else if (fly.isShocked) {
          fly.shockTimer -= delta;
          fly.mesh.rotation.z += (Math.random() - 0.5) * 2.0;
          if (fly.shockTimer <= 0) fly.isShocked = false;
        } else {
          // Полёт и дрейф
          fly.vel.x += Math.sin(time * 5 + index) * 0.2;
          fly.vel.y += Math.cos(time * 4 + index) * 0.2;
          fly.vel.multiplyScalar(0.93);

          // Анимация махов крыльев
          const wingSpeed = 50 + fly.vel.length() * 25;
          fly.leftWing.rotation.y = Math.sin(time * wingSpeed) * 0.6;
          fly.rightWing.rotation.y = -Math.sin(time * wingSpeed) * 0.6;

          // Поворот тела по вектору движения
          if (fly.vel.length() > 0.1) {
            fly.mesh.rotation.z = -Math.atan2(fly.vel.x, fly.vel.y);
          }
        }

        fly.pos.add(fly.vel.clone().multiplyScalar(delta));

        // Жесткие границы карты (Аквариум)
        const BOUND_X = 6.5;
        const BOUND_Y = 4.5;
        if (Math.abs(fly.pos.x) > BOUND_X) {
          fly.pos.x = Math.sign(fly.pos.x) * BOUND_X;
          fly.vel.x *= -0.8; // Отскок от стены
        }
        if (Math.abs(fly.pos.y) > BOUND_Y) {
          fly.pos.y = Math.sign(fly.pos.y) * BOUND_Y;
          fly.vel.y *= -0.8;
        }

        fly.mesh.position.copy(fly.pos);
      });

      // Динамическая регулировка звука жужжания
      if (buzzGain && flies.length > 0) {
        const speed = flies[0].vel.length();
        buzzGain.gain.setValueAtTime(flies[0].hp > 0 ? Math.min(0.08, 0.01 + speed * 0.01) : 0, audioCtx.currentTime);
        buzzOsc.frequency.setValueAtTime(140 + speed * 15, audioCtx.currentTime);
      }

      if (flies.length > 0) {
        document.getElementById('status').innerText = 
          `🧠 МУХ В СЦЕНЕ: ${flies.length} | HP ГЛАВНОЙ: ${Math.max(0, Math.round(flies[0].hp))}%`;
      }

      renderer.render(scene, camera);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    window.onload = init;
  </script>
</body>
</html>
