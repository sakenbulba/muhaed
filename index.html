<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Pure SNN Connectome Fly Sandbox</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; overflow: hidden; background: #020617; font-family: -apple-system, BlinkMacSystemFont, monospace; color: #38bdf8; user-select: none; }
    #canvas-container { width: 100vw; height: 100vh; touch-action: none; }
    
    #telemetry {
      position: absolute; top: 12px; left: 12px; z-index: 100;
      background: rgba(15, 23, 42, 0.85); padding: 14px; border-radius: 16px;
      border: 1px solid rgba(56, 189, 248, 0.25); font-size: 11px; line-height: 1.5;
      max-width: 300px; pointer-events: none; backdrop-filter: blur(12px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
    }

    .meter-bar { width: 100%; background: rgba(2, 6, 23, 0.9); height: 6px; border-radius: 3px; margin: 2px 0 6px; overflow: hidden; border: 1px solid rgba(255,255,255,0.05); }
    .meter-fill { height: 100%; background: linear-gradient(90deg, #0284c7, #38bdf8); width: 0%; transition: width 0.1s; }

    #ui-container {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 8px; z-index: 100; padding: 6px;
      background: rgba(15, 23, 42, 0.85); border-radius: 16px;
      border: 1px solid rgba(56, 189, 248, 0.25); backdrop-filter: blur(12px);
    }
    .btn {
      background: rgba(30, 41, 59, 0.7); border: 1px solid rgba(56, 189, 248, 0.3); color: #f8fafc;
      padding: 10px 14px; border-radius: 10px; font-weight: 600; font-size: 11px;
      cursor: pointer; transition: all 0.2s;
    }
    .btn.active { background: #0284c7; border-color: #38bdf8; box-shadow: 0 0 12px rgba(2, 132, 199, 0.6); }
  </style>
</head>
<body>

  <div id="telemetry">
    <div style="font-size: 12px; font-weight: bold; color: #fff; margin-bottom: 4px;">🧠 PURE SNN NEURO-ENGINE</div>
    <div style="opacity: 0.6; font-size: 9px; margin-bottom: 8px;">100% SPONTANEOUS MOTOR SPIKES</div>
    
    ⚡ Спайков/сек: <b id="spike-rate" style="color:#38bdf8;">0</b><br>
    
    👁 Левый глаз (Eye L):
    <div class="meter-bar"><div id="eye-l-fill" class="meter-fill"></div></div>
    
    👁 Правый глаз (Eye R):
    <div class="meter-bar"><div id="eye-r-fill" class="meter-fill"></div></div>

    🪽 Мотор L (Поворот R):
    <div class="meter-bar"><div id="motor-l-fill" class="meter-fill" style="background:#e11d48;"></div></div>

    🪽 Мотор R (Поворот L):
    <div class="meter-bar"><div id="motor-r-fill" class="meter-fill" style="background:#e11d48;"></div></div>

    📍 Режим сети: <span id="brain-status" style="color:#38bdf8; font-weight:bold;">SNN Active</span>
  </div>

  <div id="canvas-container"></div>

  <div id="ui-container">
    <button class="btn active" id="btn-food" onclick="selectTool('food')">🍕 Сахар</button>
    <button class="btn" id="btn-threat" onclick="selectTool('threat')">💥 Опасность</button>
    <button class="btn" id="btn-wall" onclick="selectTool('wall')">🧱 Барьер</button>
    <button class="btn" onclick="clearObjects()">🧹 Очистить</button>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    let scene, camera, renderer, clock;
    let flyMesh, leftWing, rightWing;
    let floorPlane, raycaster, mouse = new THREE.Vector2();
    let objects = []; 
    let currentTool = 'food';

    let flyPos = new THREE.Vector3(0, 1.0, 0);
    let flyRotY = 0;
    let flySpeed = 0;

    let isDragging = false, prevMouseX = 0, prevMouseY = 0;
    let camRadius = 11, camTheta = Math.PI / 4, camPhi = Math.PI / 3;

    // ==========================================
    // 🧠 REAL BIOLOGICAL SNN ARCHITECTURE
    // ==========================================
    const TOTAL_NEURONS = 100000;
    const SYNAPSE_COUNT = 500000;

    // Разделение нейронных популяций
    const SENSORY_EYE_L = 0;      // 0..4999 (Левый глаз)
    const SENSORY_EYE_R = 5000;   // 5000..9999 (Правый глаз)
    const INTER_NEURONS = 10000;  // 10000..89999 (Коннектом мозолистого тела)
    const MOTOR_L       = 90000;  // 90000..94999 (Двигатель левого крыла)
    const MOTOR_R       = 95000;  // 95000..99999 (Двигатель правого крыла)

    const V_REST = -70.0, V_THRESH = -50.0, V_RESET = -75.0, DECAY = 0.85;

    let V = new Float32Array(TOTAL_NEURONS);
    let I_ext = new Float32Array(TOTAL_NEURONS);
    let synFrom = new Int32Array(SYNAPSE_COUNT);
    let synTo = new Int32Array(SYNAPSE_COUNT);
    let synWeight = new Float32Array(SYNAPSE_COUNT);

    let spikeCountEyeL = 0, spikeCountEyeR = 0;
    let spikeCountMotorL = 0, spikeCountMotorR = 0;

    function initBiologicalConnectome() {
      for (let k = 0; k < SYNAPSE_COUNT; k++) {
        let src = Math.floor(Math.random() * TOTAL_NEURONS);
        let dst = Math.floor(Math.random() * TOTAL_NEURONS);
        
        synFrom[k] = src;
        synTo[k] = dst;

        // Перекрестные связи (Chiasm): сигналы с левого глаза передаются на правый мотор и наоборот
        let w = (Math.random() - 0.2) * 2.0;
        if (src < SENSORY_EYE_R && dst >= MOTOR_R) w *= 2.5; // Рефлекторная дуга
        synWeight[k] = w;
      }
      for (let i = 0; i < TOTAL_NEURONS; i++) V[i] = V_REST;
    }

    function stepSNN() {
      spikeCountEyeL = 0; spikeCountEyeR = 0;
      spikeCountMotorL = 0; spikeCountMotorR = 0;
      let totalSpikes = 0;

      // 1. Уравнение утечки мембранного потенциала (Leaky Integrate-and-Fire)
      for (let i = 0; i < TOTAL_NEURONS; i++) {
        V[i] = V_REST + (V[i] - V_REST) * DECAY + I_ext[i];
        I_ext[i] = 0;
      }

      // 2. Генерация спайков при достижении порога V_THRESH
      for (let i = 0; i < TOTAL_NEURONS; i++) {
        if (V[i] >= V_THRESH) {
          V[i] = V_RESET;
          totalSpikes++;

          if (i >= SENSORY_EYE_L && i < SENSORY_EYE_R) spikeCountEyeL++;
          else if (i >= SENSORY_EYE_R && i < INTER_NEURONS) spikeCountEyeR++;
          else if (i >= MOTOR_L && i < MOTOR_R) spikeCountMotorL++;
          else if (i >= MOTOR_R) spikeCountMotorR++;
        }
      }

      // 3. Передача синаптического тока следующему нейрону
      for (let k = 0; k < SYNAPSE_COUNT; k++) {
        if (V[synFrom[k]] === V_RESET) {
          I_ext[synTo[k]] += synWeight[k];
        }
      }

      return totalSpikes;
    }

    function selectTool(tool) {
      currentTool = tool;
      document.querySelectorAll('#ui-container .btn').forEach(b => b.classList.remove('active'));
      document.getElementById(`btn-${tool}`).classList.add('active');
    }

    // ==========================================
    // 🎨 3D ВИЗУАЛИЗАЦИЯ И ДЕТАЛИЗИРОВАННЫЕ МОДЕЛИ
    // ==========================================
    function init() {
      const container = document.getElementById('canvas-container');
      clock = new THREE.Clock();
      raycaster = new THREE.Raycaster();

      scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x020617, 0.04);

      camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
      updateCameraPosition();

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      container.appendChild(renderer.domElement);

      scene.add(new THREE.AmbientLight(0x1e293b, 1.2));

      const dirLight = new THREE.DirectionalLight(0x38bdf8, 2.2);
      dirLight.position.set(10, 20, 10);
      dirLight.castShadow = true;
      dirLight.shadow.mapSize.width = 2048;
      dirLight.shadow.mapSize.height = 2048;
      scene.add(dirLight);

      // Голографический сетчатый пол
      const floorMat = new THREE.MeshStandardMaterial({ color: 0x030712, roughness: 0.5, metalness: 0.4 });
      floorPlane = new THREE.Mesh(new THREE.PlaneGeometry(32, 32), floorMat);
      floorPlane.rotation.x = -Math.PI / 2;
      floorPlane.receiveShadow = true;
      scene.add(floorPlane);

      const grid = new THREE.GridHelper(32, 32, 0x0284c7, 0x0f172a);
      grid.position.y = 0.01;
      scene.add(grid);

      buildHighDetailFly();
      initBiologicalConnectome();

      spawnObject('food', new THREE.Vector3(3, 0, 3));
      spawnObject('threat', new THREE.Vector3(-3, 0, -2));

      container.addEventListener('pointerdown', onPointerDown);
      container.addEventListener('pointermove', onPointerMove);
      container.addEventListener('pointerup', () => isDragging = false);
      window.addEventListener('resize', onWindowResize);

      animate();
    }

    function buildHighDetailFly() {
      const group = new THREE.Group();
      const bodyMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.2, metalness: 0.8 });
      const eyeMat = new THREE.MeshStandardMaterial({ color: 0xd97706, roughness: 0.1, metalness: 0.3 });
      const wingMat = new THREE.MeshPhysicalMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.55, roughness: 0.1, transmission: 0.8 });

      // Анатомия дрозофилы
      const thorax = new THREE.Mesh(new THREE.SphereGeometry(0.32, 16, 16), bodyMat);
      thorax.scale.set(0.85, 0.75, 1.1);
      thorax.castShadow = true;
      group.add(thorax);

      const abdomen = new THREE.Mesh(new THREE.SphereGeometry(0.4, 16, 16), bodyMat);
      abdomen.position.set(0, -0.05, -0.6);
      abdomen.scale.set(0.8, 0.7, 1.4);
      abdomen.castShadow = true;
      group.add(abdomen);

      const eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.15, 12, 12), eyeMat);
      eyeL.position.set(-0.16, 0.08, 0.25);
      const eyeR = eyeL.clone(); eyeR.position.x = 0.16;
      group.add(eyeL); group.add(eyeR);

      // Крылья
      const wingGeo = new THREE.BoxGeometry(0.45, 0.005, 0.8);
      wingGeo.translate(0.22, 0, -0.35);
      leftWing = new THREE.Mesh(wingGeo, wingMat);
      leftWing.position.set(-0.08, 0.2, -0.1);
      rightWing = new THREE.Mesh(wingGeo, wingMat);
      rightWing.position.set(0.08, 0.2, -0.1);
      rightWing.scale.x = -1;

      group.add(leftWing); group.add(rightWing);
      flyMesh = group;
      scene.add(flyMesh);
    }

    // КРАСИВЫЕ 3D-МОДЕЛИ ДЛЯ ПЕСОЧНИЦЫ
    function spawnObject(type, pos) {
      const parentGroup = new THREE.Group();
      parentGroup.position.copy(pos);

      if (type === 'food') {
        // Множественный кристаллообразный сахар
        const crystalMat = new THREE.MeshStandardMaterial({ color: 0x22c55e, roughness: 0.1, metalness: 0.1, emissive: 0x15803d, emissiveIntensity: 0.4 });
        for (let i = 0; i < 5; i++) {
          const m = new THREE.Mesh(new THREE.DodecahedronGeometry(0.25 + Math.random() * 0.15), crystalMat);
          m.position.set((Math.random() - 0.5) * 0.4, 0.2 + i * 0.15, (Math.random() - 0.5) * 0.4);
          m.rotation.set(Math.random(), Math.random(), 0);
          m.castShadow = true;
          parentGroup.add(m);
        }
      } else if (type === 'threat') {
        // Опасная неоновая мина
        const coreMat = new THREE.MeshStandardMaterial({ color: 0xef4444, emissive: 0xd97706, emissiveIntensity: 0.8 });
        const core = new THREE.Mesh(new THREE.IcosahedronGeometry(0.35, 0), coreMat);
        core.position.y = 0.4;
        core.castShadow = true;
        
        const ringMat = new THREE.MeshBasicMaterial({ color: 0xef4444, wireframe: true });
        const ring = new THREE.Mesh(new THREE.TorusGeometry(0.55, 0.02, 8, 24), ringMat);
        ring.position.y = 0.4; ring.rotation.x = Math.PI / 2;
        
        parentGroup.add(core); parentGroup.add(ring);
      } else {
        // Кибер-стена / Перегородка
        const wallMat = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.4, metalness: 0.6 });
        const wall = new THREE.Mesh(new THREE.BoxGeometry(2.5, 1.2, 0.3), wallMat);
        wall.position.y = 0.6;
        wall.castShadow = true;
        parentGroup.add(wall);
      }

      parentGroup.userData = { type: type };
      scene.add(parentGroup);
      objects.push(parentGroup);
    }

    function clearObjects() {
      objects.forEach(obj => scene.remove(obj));
      objects = [];
    }

    function onPointerDown(e) {
      isDragging = true;
      prevMouseX = e.clientX; prevMouseY = e.clientY;

      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);

      const intersects = raycaster.intersectObject(floorPlane);
      if (intersects.length > 0 && e.clientY < window.innerHeight - 80) {
        spawnObject(currentTool, intersects[0].point);
      }
    }

    function onPointerMove(e) {
      if (!isDragging) return;
      let deltaX = e.clientX - prevMouseX;
      let deltaY = e.clientY - prevMouseY;
      if (Math.abs(deltaX) > 2 || Math.abs(deltaY) > 2) {
        camTheta -= deltaX * 0.005;
        camPhi = Math.max(0.2, Math.min(Math.PI / 2 - 0.05, camPhi - deltaY * 0.005));
        prevMouseX = e.clientX; prevMouseY = e.clientY;
        updateCameraPosition();
      }
    }

    function updateCameraPosition() {
      camera.position.x = flyPos.x + camRadius * Math.sin(camPhi) * Math.cos(camTheta);
      camera.position.y = flyPos.y + camRadius * Math.cos(camPhi);
      camera.position.z = flyPos.z + camRadius * Math.sin(camPhi) * Math.sin(camTheta);
      camera.lookAt(flyPos.x, flyPos.y + 0.2, flyPos.z);
    }

    // ==========================================
    // 🔄 ЦИКЛ СИМУЛЯЦИИ (SNN DRIVEN PHYSICS)
    // ==========================================
    function animate() {
      requestAnimationFrame(animate);
      const delta = Math.min(clock.getDelta(), 0.05);
      const time = clock.getElapsedTime();

      // 1. СЕТЧАТКА (Оптический ввод в сенсорные нейроны)
      // Муха смотрит по направлению своего вектора flyRotY
      let flyDir = new THREE.Vector3(Math.sin(flyRotY), 0, Math.cos(flyRotY));
      let flyLeftDir = new THREE.Vector3().crossVectors(flyDir, new THREE.Vector3(0, 1, 0)).negate();

      objects.forEach(obj => {
        let toObj = new THREE.Vector3().subVectors(obj.position, flyPos);
        let dist = toObj.length();
        if (dist < 8.0) {
          toObj.normalize();
          let dotForward = flyDir.dot(toObj);
          let dotLeft = flyLeftDir.dot(toObj);

          if (dotForward > 0) { // Объект в поле зрения
            let intensity = (8.0 - dist) * 2.0;
            if (obj.userData.type === 'threat') intensity *= -1.5; // Тормозящие синапсы

            if (dotLeft > 0.1) {
              // Попадает в левый глаз
              for (let i = SENSORY_EYE_L; i < SENSORY_EYE_R; i += 10) I_ext[i] += intensity;
            } else if (dotLeft < -0.1) {
              // Попадает в правый глаз
              for (let i = SENSORY_EYE_R; i < INTER_NEURONS; i += 10) I_ext[i] += intensity;
            }
          }
        }
      });

      // 2. ОБСЧЕТ 100,000 НЕЙРОНОВ В РЕАЛЬНОМ ВРЕМЕНИ
      let totalSpikes = stepSNN();

      // 3. ФИЗИКА ДВИЖЕНИЯ, УПРАВЛЯЕМАЯ МОТОРНЫМИ НЕЙРОНАМИ
      // Поворот зависит от разницы активностей Motor L и Motor R
      let motorDiff = (spikeCountMotorL - spikeCountMotorR) * 0.005;
      flyRotY += motorDiff;

      // Поступательная скорость зависит от суммарной активности двигателей
      let forwardDrive = (spikeCountMotorL + spikeCountMotorR) * 0.001;
      flySpeed += (forwardDrive - flySpeed) * 0.1;

      flyPos.x += Math.sin(flyRotY) * flySpeed;
      flyPos.z += Math.cos(flyRotY) * flySpeed;

      // Ограничение по краям
      flyPos.x = Math.max(-14, Math.min(14, flyPos.x));
      flyPos.z = Math.max(-14, Math.min(14, flyPos.z));
      flyPos.y = 0.9 + Math.sin(time * 3) * 0.1;

      flyMesh.position.copy(flyPos);
      flyMesh.rotation.y = flyRotY;

      // Крылья машут пропорционально выданным моторным спайкам
      let wingFreq = 10 + (spikeCountMotorL + spikeCountMotorR) * 0.5;
      leftWing.rotation.y = Math.sin(time * wingFreq) * 0.4;
      rightWing.rotation.y = -Math.sin(time * wingFreq) * 0.4;

      updateCameraPosition();

      // Обновление интерфейса
      document.getElementById('spike-rate').innerText = totalSpikes.toLocaleString();
      document.getElementById('eye-l-fill').style.width = `${Math.min(100, spikeCountEyeL * 2)}%`;
      document.getElementById('eye-r-fill').style.width = `${Math.min(100, spikeCountEyeR * 2)}%`;
      document.getElementById('motor-l-fill').style.width = `${Math.min(100, spikeCountMotorL * 4)}%`;
      document.getElementById('motor-r-fill').style.width = `${Math.min(100, spikeCountMotorR * 4)}%`;

      renderer.render(scene, camera);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    window.onload = init;
  </script>
</body>
</html>
