<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>FlyWire 500K Sandbox Simulator</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; overflow: hidden; background: #030712; font-family: monospace; color: #38bdf8; user-select: none; }
    #canvas-container { width: 100vw; height: 100vh; touch-action: none; }
    
    #telemetry {
      position: absolute; top: 12px; left: 12px; z-index: 100;
      background: rgba(15, 23, 42, 0.9); padding: 12px 16px; border-radius: 12px;
      border: 1px solid #1e293b; font-size: 11px; line-height: 1.5;
      max-width: 280px; pointer-events: none; backdrop-filter: blur(8px);
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
    }

    .meter-bar { width: 100%; background: #020617; height: 6px; border-radius: 3px; margin: 2px 0 6px; overflow: hidden; border: 1px solid #1e293b; }
    .meter-fill { height: 100%; background: #0284c7; width: 0%; transition: width 0.1s; }

    #ui-container {
      position: absolute; bottom: 16px; left: 0; width: 100vw;
      display: flex; justify-content: center; gap: 8px; z-index: 100; padding: 0 10px; flex-wrap: wrap;
    }
    .btn {
      background: #0f172a; border: 1px solid #0284c7; color: #38bdf8;
      padding: 10px 12px; border-radius: 10px; font-weight: bold; font-size: 11px;
      cursor: pointer; transition: 0.1s; backdrop-filter: blur(4px);
    }
    .btn:active { transform: scale(0.95); background: #0284c7; color: white; }
    .btn.active { background: #0284c7; color: white; border-color: #38bdf8; }
  </style>
</head>
<body>

  <div id="telemetry">
    🧠 <b>FLYWIRE 500K CONNECTOME</b><br>
    ----------------------------------<br>
    ⚡ Активные нейроны: <b style="color:#fff;">500,000</b><br>
    🔗 Синаптические каналы: <b style="color:#fff;">2,000,000</b><br>
    🔥 Спайков/сек (Hz): <span id="spike-rate">0</span><br>
    
    👁 Optic Lobe Activity:<br>
    <div class="meter-bar"><div id="optic-fill" class="meter-fill"></div></div>
    
    🛸 Central Complex (FB/EB):<br>
    <div class="meter-bar"><div id="cx-fill" class="meter-fill" style="background:#e11d48;"></div></div>

    🪽 Моторная частота: <span id="wing-freq">0 Hz</span><br>
    📍 Поведение: <span id="brain-status">Инициализация...</span>
  </div>

  <div id="canvas-container"></div>

  <div id="ui-container">
    <button class="btn" onclick="spawnObject('food')">🍕 Сахар</button>
    <button class="btn" onclick="spawnObject('threat')">💥 Угроза</button>
    <button class="btn" onclick="spawnObject('wall')">🧱 Препятствие</button>
    <button class="btn" onclick="clearObjects()">🧹 Очистить карту</button>
    <button class="btn" onclick="resetBrain()">⚡ Сброс SNN</button>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    let scene, camera, renderer, clock;
    let flyMesh, leftWing, rightWing;
    let objects = []; // Объекты в песочнице
    
    let flyPos = new THREE.Vector3(0, 1.2, 0);
    let flyVel = new THREE.Vector3(0, 0, 0);
    let flyRotY = 0;

    // Управление камерой
    let isDragging = false, prevMouseX = 0, prevMouseY = 0;
    let camRadius = 14, camTheta = Math.PI / 4, camPhi = Math.PI / 3;

    // ==========================================
    // 🧠 500,000 NEURON ULTRA SNN ENGINE
    // ==========================================
    const NUM_SENSORY = 30000;  
    const NUM_INTER = 450000;   
    const NUM_MOTOR = 20000;     
    const TOTAL_NEURONS = NUM_SENSORY + NUM_INTER + NUM_MOTOR; // 500,000

    const SYNAPSE_COUNT = 2000000; // 2 миллиона синапсов

    const V_REST = -70.0;
    const V_THRESH = -50.0;
    const V_RESET = -75.0;
    const DECAY = 0.82;

    let V = new Float32Array(TOTAL_NEURONS);
    let I_ext = new Float32Array(TOTAL_NEURONS);
    
    let synFrom = new Int32Array(SYNAPSE_COUNT);
    let synTo = new Int32Array(SYNAPSE_COUNT);
    let synWeight = new Float32Array(SYNAPSE_COUNT);

    let motorSpikeActive = false;
    let opticSpikes = 0;
    let cxExcitation = 0;

    function initConnectomeWeights() {
      for (let k = 0; k < SYNAPSE_COUNT; k++) {
        synFrom[k] = Math.floor(Math.random() * TOTAL_NEURONS);
        synTo[k] = Math.floor(Math.random() * (TOTAL_NEURONS - NUM_SENSORY)) + NUM_SENSORY;
        synWeight[k] = (Math.random() - 0.3) * 2.5;
      }
      for (let i = 0; i < TOTAL_NEURONS; i++) V[i] = V_REST;
    }

    function updateSNN() {
      let currentSpikes = 0;
      opticSpikes = 0;
      motorSpikeActive = false;

      for (let i = 0; i < TOTAL_NEURONS; i++) {
        V[i] = V_REST + (V[i] - V_REST) * DECAY + I_ext[i];
        I_ext[i] = 0;
      }

      for (let i = 0; i < TOTAL_NEURONS; i++) {
        if (V[i] >= V_THRESH) {
          V[i] = V_RESET;
          currentSpikes++;

          if (i < NUM_SENSORY) opticSpikes++;
          if (i >= NUM_SENSORY + NUM_INTER) motorSpikeActive = true;
        }
      }

      for (let k = 0; k < SYNAPSE_COUNT; k++) {
        if (V[synFrom[k]] === V_RESET) {
          I_ext[synTo[k]] += synWeight[k];
        }
      }

      cxExcitation = Math.min(1.0, (currentSpikes - opticSpikes) / 15000);
      return currentSpikes;
    }

    function resetBrain() {
      for (let i = 0; i < TOTAL_NEURONS; i++) V[i] = V_REST;
      flyPos.set(0, 1.2, 0);
      flyVel.set(0, 0, 0);
      document.getElementById('brain-status').innerText = 'Сброшен!';
    }

    // ==========================================
    // 🌎 3D КАРТА И ОБЪЕКТЫ ПЕСОЧНИЦЫ
    // ==========================================
    function init() {
      const container = document.getElementById('canvas-container');
      clock = new THREE.Clock();

      scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x030712, 0.03);

      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      updateCameraPosition();

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      container.appendChild(renderer.domElement);

      // Освещение окружения
      scene.add(new THREE.AmbientLight(0x38bdf8, 0.4));
      const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
      dirLight.position.set(10, 20, 10);
      dirLight.castShadow = true;
      scene.add(dirLight);

      // Поверхность стола / Карты
      const floorGeo = new THREE.PlaneGeometry(30, 30);
      const floorMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.8 });
      const floor = new THREE.Mesh(floorGeo, floorMat);
      floor.rotation.x = -Math.PI / 2;
      floor.receiveShadow = true;
      scene.add(floor);

      const grid = new THREE.GridHelper(30, 30, 0x0284c7, 0x1e293b);
      grid.position.y = 0.01;
      scene.add(grid);

      buildFlyMesh();
      initConnectomeWeights();

      // Заводские стартовые объекты
      spawnObject('food', new THREE.Vector3(3, 0.5, 3));
      spawnObject('threat', new THREE.Vector3(-4, 0.5, -2));

      // Управление вращением камеры
      container.addEventListener('pointerdown', e => { isDragging = true; prevMouseX = e.clientX; prevMouseY = e.clientY; });
      container.addEventListener('pointermove', e => {
        if (!isDragging) return;
        let deltaX = e.clientX - prevMouseX;
        let deltaY = e.clientY - prevMouseY;
        camTheta -= deltaX * 0.005;
        camPhi = Math.max(0.1, Math.min(Math.PI / 2 - 0.05, camPhi - deltaY * 0.005));
        prevMouseX = e.clientX; prevMouseY = e.clientY;
        updateCameraPosition();
      });
      container.addEventListener('pointerup', () => isDragging = false);
      window.addEventListener('resize', onWindowResize);

      animate();
    }

    function updateCameraPosition() {
      camera.position.x = camRadius * Math.sin(camPhi) * Math.cos(camTheta);
      camera.position.y = camRadius * Math.cos(camPhi);
      camera.position.z = camRadius * Math.sin(camPhi) * Math.sin(camTheta);
      camera.lookAt(flyPos.x, flyPos.y + 0.5, flyPos.z);
    }

    function buildFlyMesh() {
      const flyGroup = new THREE.Group();
      const bodyMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.3 });
      const eyeMat = new THREE.MeshStandardMaterial({ color: 0xd97706, roughness: 0.2 });
      const wingMat = new THREE.MeshPhysicalMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.5, roughness: 0.1 });

      // Туловище и брюшко
      const thorax = new THREE.Mesh(new THREE.SphereGeometry(0.35, 12, 12), bodyMat);
      thorax.scale.set(0.9, 0.8, 1.1);
      flyGroup.add(thorax);

      const abdomen = new THREE.Mesh(new THREE.SphereGeometry(0.45, 12, 12), bodyMat);
      abdomen.position.set(0, -0.05, -0.6);
      abdomen.scale.set(0.85, 0.75, 1.4);
      flyGroup.add(abdomen);

      // Фасеточные глаза
      const eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.16, 10, 10), eyeMat);
      eyeL.position.set(-0.18, 0.1, 0.28);
      const eyeR = eyeL.clone();
      eyeR.position.x = 0.18;
      flyGroup.add(eyeL); flyGroup.add(eyeR);

      // Крылья
      const wingGeo = new THREE.BoxGeometry(0.5, 0.01, 0.9);
      wingGeo.translate(0.25, 0, -0.35);
      leftWing = new THREE.Mesh(wingGeo, wingMat);
      leftWing.position.set(-0.1, 0.22, -0.1);
      rightWing = new THREE.Mesh(wingGeo, wingMat);
      rightWing.position.set(0.1, 0.22, -0.1);
      rightWing.scale.x = -1;

      flyGroup.add(leftWing); flyGroup.add(rightWing);
      flyMesh = flyGroup;
      flyMesh.castShadow = true;
      scene.add(flyMesh);
    }

    function spawnObject(type, pos = null) {
      let geo, mat, color;
      if (type === 'food') { geo = new THREE.BoxGeometry(0.8, 0.8, 0.8); color = 0x22c55e; }
      else if (type === 'threat') { geo = new THREE.ConeGeometry(0.6, 1.2, 16); color = 0xef4444; }
      else { geo = new THREE.BoxGeometry(2, 1.5, 0.5); color = 0x64748b; }

      mat = new THREE.MeshStandardMaterial({ color: color, roughness: 0.4 });
      const mesh = new THREE.Mesh(geo, mat);
      
      if (pos) { mesh.position.copy(pos); } 
      else {
        mesh.position.set((Math.random() - 0.5) * 16, 0.4, (Math.random() - 0.5) * 16);
      }
      mesh.castShadow = true;
      mesh.userData = { type: type };
      scene.add(mesh);
      objects.push(mesh);
    }

    function clearObjects() {
      objects.forEach(obj => scene.remove(obj));
      objects = [];
    }

    // ==========================================
    // 🔄 ОСНОВНОЙ ЦИКЛ СИМУЛЯЦИИ И ИИ
    // ==========================================
    function animate() {
      requestAnimationFrame(animate);
      const delta = Math.min(clock.getDelta(), 0.05);
      const time = clock.getElapsedTime();

      // Поиск ближайших объектов органами чувств
      let nearestDist = 999;
      let nearestObj = null;

      objects.forEach(obj => {
        let d = flyPos.distanceTo(obj.position);
        if (d < nearestDist) { nearestDist = d; nearestObj = obj; }
      });

      // Передача сигналов от органов чувств в SNN
      if (nearestObj && nearestDist < 6.0) {
        let stim = (6.0 - nearestDist) * 3.0;
        for (let i = 0; i < NUM_SENSORY; i++) I_ext[i] += stim;
      }

      const spikesCount = updateSNN();

      // Физическая логика принятия решений
      if (nearestObj && nearestDist < 6.0) {
        let dir = new THREE.Vector3().subVectors(flyPos, nearestObj.position);
        dir.y = 0; dir.normalize();

        if (nearestObj.userData.type === 'food') {
          // Подлёт к еде
          flyVel.add(dir.negate().multiplyScalar(0.4 * delta));
          document.getElementById('brain-status').innerText = '🍕 ПОДЛЁТ К ЕДЕ';
        } else if (nearestObj.userData.type === 'threat') {
          // Убегание от опасности
          flyVel.add(dir.multiplyScalar(0.9 * delta));
          document.getElementById('brain-status').innerText = '⚠ ПАНИКА / РЕФЛЕКС ВЗЛЁТА';
        }
      } else {
        // Случайный дрейф
        flyVel.x += Math.sin(time * 1.2) * 0.0015;
        flyVel.z += Math.cos(time * 1.5) * 0.0015;
        flyVel.multiplyScalar(0.92);
        document.getElementById('brain-status').innerText = 'ПОКОЙ / ИССЛЕДОВАНИЕ';
      }

      // Маховые движения крыльев
      let wingSpeed = flyVel.length() > 0.01 ? 40 : 10;
      leftWing.rotation.y = Math.sin(time * wingSpeed) * 0.4;
      rightWing.rotation.y = -Math.sin(time * wingSpeed) * 0.4;

      // Ограничение по границам карты
      flyPos.add(flyVel);
      flyPos.x = Math.max(-14, Math.min(14, flyPos.x));
      flyPos.z = Math.max(-14, Math.min(14, flyPos.z));
      flyPos.y = 0.8 + Math.sin(time * 2) * 0.15; // Легкий забор воздуха

      flyMesh.position.copy(flyPos);

      // Плавный поворот корпуса по направлению полёта
      if (flyVel.lengthSq() > 0.0001) {
        let targetAngle = Math.atan2(flyVel.x, flyVel.z);
        flyRotY += (targetAngle - flyRotY) * 0.1;
        flyMesh.rotation.y = flyRotY;
      }

      updateCameraPosition();

      // Обновление телеметрии (Нормализованная частота в Гц)
      let normSpikes = Math.min(2000, Math.round((spikesCount / TOTAL_NEURONS) * 15000));
      document.getElementById('spike-rate').innerText = normSpikes.toLocaleString();
      document.getElementById('optic-fill').style.width = `${Math.min(100, (opticSpikes / 1500) * 100)}%`;
      document.getElementById('cx-fill').style.width = `${Math.min(100, cxExcitation * 100)}%`;
      document.getElementById('wing-freq').innerText = `${wingSpeed * 4} Hz`;

      renderer.render(scene, camera);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    window.onload = init;
  </script>
</body>
</html>
