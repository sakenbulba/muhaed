<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>IRL Fly Biology Sandbox</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; overflow: hidden; background: #0f172a; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; color: white; user-select: none; }
    #canvas-container { width: 100vw; height: 100vh; touch-action: none; }
    
    /* Меню с поддержкой свайпа на Android */
    #ui-container {
      position: absolute; bottom: 12px; left: 0; width: 100vw;
      display: flex; justify-content: center; z-index: 100; pointer-events: none;
    }
    
    #ui {
      pointer-events: auto; display: flex; gap: 8px; background: rgba(15, 23, 42, 0.92);
      padding: 10px 14px; border-radius: 20px; backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15); max-width: 94vw;
      overflow-x: auto; scrollbar-width: none; touch-action: pan-x;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }
    #ui::-webkit-scrollbar { display: none; }
    
    .btn {
      background: #1e293b; border: 1px solid #334155; color: white;
      padding: 10px 14px; border-radius: 12px; font-size: 13px; font-weight: 700;
      display: flex; align-items: center; gap: 5px; cursor: pointer; white-space: nowrap;
      flex-shrink: 0; transition: transform 0.1s ease, background 0.2s ease;
    }
    .btn:active { transform: scale(0.94); }
    .btn.active { background: #2563eb; border-color: #60a5fa; }
    .btn-poop.active { background: #78350f; border-color: #d97706; }
    .btn-tape.active { background: #854d0e; border-color: #f59e0b; }
    .btn-shock.active { background: #dc2626; border-color: #f87171; }

    #status {
      position: absolute; top: 12px; left: 12px; z-index: 100;
      background: rgba(15, 23, 42, 0.85); padding: 8px 14px; border-radius: 12px;
      font-size: 11px; font-weight: 700; border: 1px solid rgba(255,255,255,0.1);
      letter-spacing: 0.5px; backdrop-filter: blur(8px);
    }
  </style>
</head>
<body>

  <div id="status">🪰 СОСТОЯНИЕ: ИССЛЕДОВАНИЕ | HP: 100%</div>
  <div id="canvas-container"></div>

  <div id="ui-container">
    <div id="ui">
      <button class="btn active" id="btn-touch" onclick="setMode('touch')">👈 Пугать пальцем</button>
      <button class="btn btn-poop" id="btn-poop" onclick="setMode('poop')">💩 Еда (Запах)</button>
      <button class="btn btn-tape" id="btn-tape" onclick="setMode('tape')">🪰 Липкая лента</button>
      <button class="btn btn-shock" id="btn-shock" onclick="setMode('shock')">⚡ Шокер</button>
      <button class="btn" onclick="respawnFly()">🔄 Респавн</button>
      <button class="btn" onclick="spawnFly()">🪰 +1 Муха</button>
    </div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    let scene, camera, renderer, clock;
    let flies = [];
    let currentMode = 'touch';
    let pointerPos = new THREE.Vector3();
    let poopMesh = null, tapeMesh = null;

    // Звуковой движок
    let audioCtx = null, buzzOsc = null, buzzGain = null;

    function initAudio() {
      if (audioCtx) return;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      buzzOsc = audioCtx.createOscillator();
      buzzGain = audioCtx.createGain();
      buzzOsc.type = 'sawtooth';
      buzzOsc.frequency.setValueAtTime(160, audioCtx.currentTime);
      buzzGain.gain.setValueAtTime(0.01, audioCtx.currentTime);
      buzzOsc.connect(buzzGain);
      buzzGain.connect(audioCtx.destination);
      buzzOsc.start();
    }

    function init() {
      const container = document.getElementById('canvas-container');
      clock = new THREE.Clock();

      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0f172a);
      scene.fog = new THREE.FogExp2(0x0f172a, 0.03);

      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 0, 10);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      container.appendChild(renderer.domElement);

      scene.add(new THREE.AmbientLight(0xffffff, 0.8));
      const light = new THREE.DirectionalLight(0xffffff, 1.2);
      light.position.set(5, 10, 7);
      scene.add(light);

      // Задняя стенка (комната)
      const grid = new THREE.GridHelper(25, 25, 0x3b82f6, 0x1e293b);
      grid.rotation.x = Math.PI / 2;
      grid.position.z = -4;
      scene.add(grid);

      spawnFly();

      container.addEventListener('pointerdown', (e) => { initAudio(); handlePointer(e); });
      container.addEventListener('pointermove', (e) => { if (e.buttons > 0) handlePointer(e); });
      window.addEventListener('resize', onWindowResize);

      animate();
    }

    // Анатомическая реалистичная 3D модель
    function buildCorrectFly() {
      const flyGroup = new THREE.Group();

      const bodyMat = new THREE.MeshStandardMaterial({ color: 0x111115, roughness: 0.3, metalness: 0.6 });
      const eyeMat = new THREE.MeshStandardMaterial({ color: 0x991b1b, roughness: 0.2 });
      const wingMat = new THREE.MeshPhysicalMaterial({
        color: 0xf0f9ff, transmission: 0.9, transparent: true, opacity: 0.7, roughness: 0.1
      });

      // Брюшко
      const abdomen = new THREE.Mesh(new THREE.SphereGeometry(0.45, 14, 14), bodyMat);
      abdomen.scale.set(0.9, 0.8, 1.3);
      abdomen.position.set(0, 0, -0.5);
      flyGroup.add(abdomen);

      // Грудь
      const thorax = new THREE.Mesh(new THREE.SphereGeometry(0.4, 14, 14), bodyMat);
      flyGroup.add(thorax);

      // Голова
      const head = new THREE.Mesh(new THREE.SphereGeometry(0.28, 14, 14), bodyMat);
      head.position.set(0, 0, 0.45);
      flyGroup.add(head);

      // Глаза
      const leftEye = new THREE.Mesh(new THREE.SphereGeometry(0.18, 12, 12), eyeMat);
      leftEye.position.set(-0.2, 0.08, 0.5);
      const rightEye = leftEye.clone();
      rightEye.position.x = 0.2;
      flyGroup.add(leftEye);
      flyGroup.add(rightEye);

      // Лапки (Передние для умывания)
      const legMat = new THREE.MeshBasicMaterial({ color: 0x050505 });
      const legGeo = new THREE.CylinderGeometry(0.02, 0.02, 0.4);
      
      const leftLeg = new THREE.Mesh(legGeo, legMat);
      leftLeg.position.set(-0.2, -0.2, 0.4);
      leftLeg.rotation.z = 0.5;
      
      const rightLeg = leftLeg.clone();
      rightLeg.position.x = 0.2;
      rightLeg.rotation.z = -0.5;

      flyGroup.add(leftLeg);
      flyGroup.add(rightLeg);

      // Крылья
      const wingGeo = new THREE.BoxGeometry(0.65, 0.01, 1.1);
      wingGeo.translate(0.32, 0, -0.45);

      const leftWing = new THREE.Mesh(wingGeo, wingMat);
      leftWing.position.set(-0.1, 0.3, 0);
      const rightWing = new THREE.Mesh(wingGeo, wingMat);
      rightWing.position.set(0.1, 0.3, 0);
      rightWing.scale.x = -1;

      flyGroup.add(leftWing);
      flyGroup.add(rightWing);

      return {
        mesh: flyGroup, leftWing, rightWing, leftLeg, rightLeg,
        pos: new THREE.Vector3(0, 0, 0),
        vel: new THREE.Vector3(),
        hp: 100,
        state: 'FLYING', // FLYING, GROOMING, STUCK, PANIC
        stateTimer: 0
      };
    }

    function spawnFly() {
      const flyData = buildCorrectFly();
      flyData.pos.set((Math.random() - 0.5) * 3, (Math.random() - 0.5) * 3, 0);
      scene.add(flyData.mesh);
      flies.push(flyData);
    }

    function respawnFly() {
      flies.forEach(f => scene.remove(f.mesh));
      flies = [];
      if (poopMesh) { scene.remove(poopMesh); poopMesh = null; }
      if (tapeMesh) { scene.remove(tapeMesh); tapeMesh = null; }
      spawnFly();
    }

    function setMode(mode) {
      currentMode = mode;
      document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
      document.getElementById(`btn-${mode}`)?.classList.add('active');
    }

    function handlePointer(e) {
      const vec = new THREE.Vector3(
        (e.clientX / window.innerWidth) * 2 - 1,
        -(e.clientY / window.innerHeight) * 2 + 1, 0.5
      );
      vec.unproject(camera);
      const dir = vec.sub(camera.position).normalize();
      const dist = -camera.position.z / dir.z;
      pointerPos = camera.position.clone().add(dir.multiplyScalar(dist));

      if (currentMode === 'poop') {
        createPoop(pointerPos);
      } else if (currentMode === 'tape') {
        createTape(pointerPos);
      } else {
        flies.forEach(fly => {
          const d = fly.pos.distanceTo(pointerPos);
          if (currentMode === 'touch' && d < 3.0) {
            // Рефлекс резкого прыжка назад от движения пальца
            fly.state = 'PANIC';
            fly.stateTimer = 1.5;
            const dodgeDir = fly.pos.clone().sub(pointerPos).normalize().add(new THREE.Vector3(0, 0, 1));
            fly.vel.add(dodgeDir.multiplyScalar(8.0));
          } else if (currentMode === 'shock' && d < 2.5) {
            fly.hp -= 35;
            fly.vel.add(new THREE.Vector3((Math.random()-0.5)*5, -4, 0));
          }
        });
      }
    }

    function createPoop(pos) {
      if (poopMesh) scene.remove(poopMesh);
      const group = new THREE.Group();
      const mat = new THREE.MeshStandardMaterial({ color: 0x78350f, roughness: 0.9 });
      const b1 = new THREE.Mesh(new THREE.SphereGeometry(0.4, 10, 10), mat);
      const b2 = new THREE.Mesh(new THREE.SphereGeometry(0.28, 10, 10), mat);
      b2.position.y = 0.3;
      group.add(b1); group.add(b2);
      group.position.copy(pos);
      poopMesh = group;
      scene.add(poopMesh);
    }

    function createTape(pos) {
      if (tapeMesh) scene.remove(tapeMesh);
      const geo = new THREE.CylinderGeometry(0.15, 0.15, 6, 12);
      const mat = new THREE.MeshStandardMaterial({ color: 0xca8a04, roughness: 0.1, transparent: true, opacity: 0.8 });
      tapeMesh = new THREE.Mesh(geo, mat);
      tapeMesh.position.copy(pos);
      tapeMesh.position.y = 1; // Свисает сверху
      scene.add(tapeMesh);
    }

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      const time = clock.getElapsedTime();

      const boundX = (camera.aspect * 5.0);
      const boundY = 3.8;

      flies.forEach((fly, index) => {
        if (fly.hp <= 0) {
          fly.vel.y = -6.0;
          fly.mesh.rotation.x = Math.PI;
        } else if (fly.state === 'STUCK') {
          // Застряла на липкой ленте
          fly.vel.set(0, 0, 0);
          fly.leftWing.rotation.y = Math.sin(time * 60) * 0.8; // Вырывается
          fly.rightWing.rotation.y = 0;
        } else {
          // Проверка застревания на ленте
          if (tapeMesh && fly.pos.distanceTo(tapeMesh.position) < 0.6) {
            fly.state = 'STUCK';
          }

          // Поведение в полёте
          if (fly.state === 'PANIC') {
            fly.stateTimer -= delta;
            if (fly.stateTimer <= 0) fly.state = 'FLYING';
          } else if (poopMesh) {
            // Поиск запаха еды зигзагом
            const dir = poopMesh.position.clone().sub(fly.pos);
            if (dir.length() > 0.4) {
              const zigzag = new THREE.Vector3(Math.sin(time * 12) * 1.5, Math.cos(time * 12) * 1.5, 0);
              fly.vel.add(dir.normalize().add(zigzag).multiplyScalar(2.0 * delta));
            } else {
              // Села на какашку -> переходит к чистке лапок!
              fly.state = 'GROOMING';
              fly.stateTimer = 4.0;
            }
          }

          if (fly.state === 'GROOMING') {
            fly.vel.multiplyScalar(0.8);
            // Анимация умывания передними лапками
            fly.leftLeg.rotation.z = Math.sin(time * 20) * 0.8 + 0.5;
            fly.rightLeg.rotation.z = -Math.sin(time * 20) * 0.8 - 0.5;
            fly.stateTimer -= delta;
            if (fly.stateTimer <= 0) fly.state = 'FLYING';
          } else {
            // Обычный полет
            fly.leftLeg.rotation.z = 0.5;
            fly.rightLeg.rotation.z = -0.5;

            fly.vel.x += Math.sin(time * 4 + index) * 0.15;
            fly.vel.y += Math.cos(time * 3 + index) * 0.15;
            fly.vel.multiplyScalar(0.94);

            const speed = fly.vel.length();
            fly.leftWing.rotation.y = Math.sin(time * (40 + speed * 25)) * 0.5;
            fly.rightWing.rotation.y = -Math.sin(time * (40 + speed * 25)) * 0.5;

            if (speed > 0.1) fly.mesh.rotation.z = -Math.atan2(fly.vel.x, fly.vel.y);
          }
        }

        fly.pos.add(fly.vel.clone().multiplyScalar(delta));

        // Границы экрана и отскок
        if (Math.abs(fly.pos.x) > boundX) {
          fly.pos.x = Math.sign(fly.pos.x) * boundX;
          fly.vel.x *= -0.7;
        }
        if (Math.abs(fly.pos.y) > boundY) {
          fly.pos.y = Math.sign(fly.pos.y) * boundY;
          fly.vel.y *= -0.7;
        }

        fly.mesh.position.copy(fly.pos);
      });

      if (flies.length > 0) {
        document.getElementById('status').innerText = 
          `🪰 МУХА: ${flies[0].state} | HP: ${Math.max(0, Math.round(flies[0].hp))}%`;
      }

      renderer.render(scene, camera);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    window.onload = init;
  </script>
</body>
</html>
