<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Connectome Spiking Fly Neural Net</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; overflow: hidden; background: #020617; font-family: monospace; color: #38bdf8; user-select: none; }
    #canvas-container { width: 100vw; height: 100vh; touch-action: none; }
    
    #telemetry {
      position: absolute; top: 10px; left: 10px; z-index: 100;
      background: rgba(2, 6, 23, 0.9); padding: 12px; border-radius: 10px;
      border: 1px solid #1e293b; font-size: 11px; line-height: 1.4;
      max-width: 280px; pointer-events: none; backdrop-filter: blur(8px);
    }

    #ui-container {
      position: absolute; bottom: 16px; left: 0; width: 100vw;
      display: flex; justify-content: center; z-index: 100;
    }
    .btn {
      background: #0f172a; border: 1px solid #0284c7; color: #38bdf8;
      padding: 12px 20px; border-radius: 12px; font-weight: bold; font-size: 13px;
      cursor: pointer; transition: 0.1s;
    }
    .btn:active { transform: scale(0.95); background: #0284c7; color: white; }
  </style>
</head>
<body>

  <div id="telemetry">
    ⚙️ <b>MAX CONNECTOME SNN</b><br>
    -------------------------<br>
    🧠 Активные нейроны: <span id="net-count">0</span><br>
    ⚡ Спайков/сек (Hz): <span id="spike-rate">0</span><br>
    👁️ Sensory (L / R): <span id="sensory-val">0 / 0</span> mV<br>
    🍗 Motor Wings Spike: <span id="motor-val">OFF</span><br>
    📍 Статус: <span id="brain-status">Инициализация...</span>
  </div>

  <div id="canvas-container"></div>

  <div id="ui-container">
    <button class="btn" onclick="resetBrain()">⚡ Сбросить потенциал мембран</button>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    let scene, camera, renderer, clock;
    let flyMesh, leftWing, rightWing;
    let pointerPos = new THREE.Vector3();
    let flyPos = new THREE.Vector3(0, 0, 0);
    let flyVel = new THREE.Vector3(0, 0, 0);

    // ==========================================
    // 🧠 MAX MOBILE SNN CONNECTOME (30,000 NEURONS)
    // ==========================================
    const NUM_SENSORY = 3000;   // Глазные фасетки (Optic Lobe)
    const NUM_INTER = 26500;    // Основной мозг (Central Complex)
    const NUM_MOTOR = 500;      // Моторные аксоны
    const TOTAL_NEURONS = NUM_SENSORY + NUM_INTER + NUM_MOTOR;

    const V_REST = -70.0;
    const V_THRESH = -52.0;
    const V_RESET = -75.0;
    const DECAY = 0.82;

    let V = new Float32Array(TOTAL_NEURONS);
    let I_ext = new Float32Array(TOTAL_NEURONS);
    
    // Высокопроизводительные одномерные массивы для 150 000+ синапсов
    let synFrom = new Int32Array(180000);
    let synTo = new Int32Array(180000);
    let synWeight = new Float32Array(180000);
    let totalSynapses = 0;

    let motorSpikeActive = false;

    function initConnectomeWeights() {
      let ptr = 0;
      // Генерация 180,000 синаптических связей между слоями
      for (let i = 0; i < TOTAL_NEURONS; i++) {
        let connCount = i < NUM_SENSORY ? 8 : 5;
        for (let c = 0; c < connCount; c++) {
          if (ptr >= 180000) break;
          let target = Math.floor(Math.random() * (TOTAL_NEURONS - NUM_SENSORY)) + NUM_SENSORY;
          if (target !== i) {
            synFrom[ptr] = i;
            synTo[ptr] = target;
            synWeight[ptr] = (Math.random() - 0.35) * 3.0;
            ptr++;
          }
        }
      }
      totalSynapses = ptr;
      for (let i = 0; i < TOTAL_NEURONS; i++) V[i] = V_REST;
    }

    function updateSNN(dt) {
      let currentSpikes = 0;
      motorSpikeActive = false;

      // 1. Утечка потенциала мембраны
      for (let i = 0; i < TOTAL_NEURONS; i++) {
        V[i] = V_REST + (V[i] - V_REST) * DECAY + I_ext[i];
        I_ext[i] = 0;
      }

      // 2. Распространение спайков по быстрым массивам
      for (let i = 0; i < TOTAL_NEURONS; i++) {
        if (V[i] >= V_THRESH) {
          V[i] = V_RESET;
          currentSpikes++;
          if (i >= NUM_SENSORY + NUM_INTER) motorSpikeActive = true;
        }
      }

      // Передача импульсов по синапсам
      for (let k = 0; k < totalSynapses; k++) {
        let src = synFrom[k];
        if (V[src] === V_RESET) { // Если источниковый нейрон сгенерировал спайк
          I_ext[synTo[k]] += synWeight[k];
        }
      }

      return currentSpikes;
    }

    function resetBrain() {
      for (let i = 0; i < TOTAL_NEURONS; i++) V[i] = V_REST;
      flyPos.set(0, 0, 0);
      flyVel.set(0, 0, 0);
      document.getElementById('brain-status').innerText = 'Сброшен!';
    }

    // ==========================================
    // 🎨 3D ГРАФИКА
    // ==========================================
    function init() {
      const container = document.getElementById('canvas-container');
      clock = new THREE.Clock();

      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 0, 8);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      container.appendChild(renderer.domElement);

      scene.add(new THREE.AmbientLight(0x38bdf8, 0.6));
      const light = new THREE.DirectionalLight(0xffffff, 1.2);
      light.position.set(5, 10, 7);
      scene.add(light);

      buildFlyMesh();
      initConnectomeWeights();

      document.getElementById('net-count').innerText = TOTAL_NEURONS;

      container.addEventListener('pointermove', handlePointer);
      container.addEventListener('pointerdown', handlePointer);
      window.addEventListener('resize', onWindowResize);

      animate();
    }

    function buildFlyMesh() {
      const flyGroup = new THREE.Group();
      const bodyMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.4 });
      const eyeMat = new THREE.MeshStandardMaterial({ color: 0xef4444 });
      const wingMat = new THREE.MeshPhysicalMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.6 });

      const body = new THREE.Mesh(new THREE.SphereGeometry(0.4, 12, 12), bodyMat);
      body.scale.set(0.8, 0.7, 1.2);
      flyGroup.add(body);

      const eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.15, 10, 10), eyeMat);
      eyeL.position.set(-0.18, 0.08, 0.35);
      const eyeR = eyeL.clone();
      eyeR.position.x = 0.18;
      flyGroup.add(eyeL); flyGroup.add(eyeR);

      const wingGeo = new THREE.BoxGeometry(0.5, 0.01, 0.8);
      wingGeo.translate(0.25, 0, -0.3);
      leftWing = new THREE.Mesh(wingGeo, wingMat);
      leftWing.position.set(-0.08, 0.2, 0);
      rightWing = new THREE.Mesh(wingGeo, wingMat);
      rightWing.position.set(0.08, 0.2, 0);
      rightWing.scale.x = -1;

      flyGroup.add(leftWing); flyGroup.add(rightWing);
      flyMesh = flyGroup;
      scene.add(flyMesh);
    }

    function handlePointer(e) {
      const vec = new THREE.Vector3(
        (e.clientX / window.innerWidth) * 2 - 1,
        -(e.clientY / window.innerHeight) * 2 + 1, 0.5
      );
      vec.unproject(camera);
      const dir = vec.sub(camera.position).normalize();
      const dist = -camera.position.z / dir.z;
      pointerPos = camera.position.clone().add(dir.multiplyScalar(dist));
    }

    function getScreenBounds() {
      const vFOV = THREE.MathUtils.degToRad(camera.fov);
      const height = 2 * Math.tan(vFOV / 2) * camera.position.z;
      const width = height * camera.aspect;
      return { x: (width / 2) - 0.4, y: (height / 2) - 0.6 };
    }

    function animate() {
      requestAnimationFrame(animate);
      const delta = Math.min(clock.getDelta(), 0.05);
      const time = clock.getElapsedTime();

      const bounds = getScreenBounds();

      // Раздражение 3000 сенсоров фасеток при приближении пальца
      const distToPointer = flyPos.distanceTo(pointerPos);
      let sensoryVal = 0;

      if (distToPointer < 2.5) {
        sensoryVal = (2.5 - distToPointer) * 5.0;
        for (let i = 0; i < NUM_SENSORY; i++) I_ext[i] += sensoryVal;
      }

      const spikesCount = updateSNN(delta);

      if (motorSpikeActive) {
        const escapeDir = flyPos.clone().sub(pointerPos).normalize();
        flyVel.add(escapeDir.multiplyScalar(0.9 * delta));
        
        leftWing.rotation.y = Math.sin(time * 45) * 0.5;
        rightWing.rotation.y = -Math.sin(time * 45) * 0.5;
        document.getElementById('brain-status').innerText = '⚠ ВЗЛЁТ (30k SNN SPIKE)';
      } else {
        flyVel.x += Math.sin(time * 1.5) * 0.003;
        flyVel.y += Math.cos(time * 1.2) * 0.003;
        flyVel.multiplyScalar(0.85);
        
        leftWing.rotation.y = Math.sin(time * 8) * 0.15;
        rightWing.rotation.y = -Math.sin(time * 8) * 0.15;
        document.getElementById('brain-status').innerText = 'ПОКОЙ / ДРЕЙФ';
      }

      if (Math.abs(flyPos.x) > bounds.x) {
        flyPos.x = Math.sign(flyPos.x) * bounds.x;
        flyVel.x *= -0.2;
      }
      if (Math.abs(flyPos.y) > bounds.y) {
        flyPos.y = Math.sign(flyPos.y) * bounds.y;
        flyVel.y *= -0.2;
      }

      flyPos.add(flyVel);
      flyMesh.position.copy(flyPos);

      if (flyVel.length() > 0.002) {
        flyMesh.rotation.z = -Math.atan2(flyVel.x, flyVel.y);
      }

      document.getElementById('spike-rate').innerText = spikesCount * 25;
      document.getElementById('sensory-val').innerText = `${sensoryVal.toFixed(1)} / ${sensoryVal.toFixed(1)}`;
      document.getElementById('motor-val').innerText = motorSpikeActive ? 'SPIKE' : 'IDLE';

      renderer.render(scene, camera);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    window.onload = init;
  </script>
</body>
</html>
