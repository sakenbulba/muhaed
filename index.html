<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Advanced Fly Sandbox</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    * { touch-action: none; user-select: none; }
    body { margin: 0; overflow: hidden; background: #08090d; font-family: -apple-system, BlinkMacSystemFont, sans-serif; color: white; }
    #canvas-container { width: 100vw; height: 100vh; }
    
    #ui {
      position: absolute; bottom: 15px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 6px; background: rgba(15, 20, 32, 0.9);
      padding: 8px 12px; border-radius: 16px; backdrop-filter: blur(12px);
      border: 1px solid rgba(255,255,255,0.1); max-width: 95vw; overflow-x: auto;
    }
    
    .btn {
      background: #1a202c; border: 1px solid #2d3748; color: white;
      padding: 8px 12px; border-radius: 10px; font-size: 12px; font-weight: 600;
      display: flex; align-items: center; gap: 4px; cursor: pointer; white-space: nowrap;
    }
    .btn.active { background: #3182ce; border-color: #63b3ed; }
    .btn-shock { border-color: #e53e3e; } .btn-shock.active { background: #c53030; }
    .btn-spray { border-color: #805ad5; } .btn-spray.active { background: #6b46c1; }
    .btn-magnet { border-color: #dd6b20; } .btn-magnet.active { background: #c05621; }

    #status {
      position: absolute; top: 12px; left: 12px;
      background: rgba(0,0,0,0.7); padding: 6px 12px; border-radius: 8px;
      font-size: 11px; border: 1px solid rgba(255,255,255,0.1); letter-spacing: 0.5px;
    }
  </style>
</head>
<body>

  <div id="status">🧠 СОСТОЯНИЕ: НОРМА [HP: 100%]</div>
  <div id="canvas-container"></div>

  <div id="ui">
    <button class="btn active" id="btn-touch" onclick="setMode('touch')">👈 Толкать</button>
    <button class="btn btn-shock" id="btn-shock" onclick="setMode('shock')">⚡ Шокер</button>
    <button class="btn btn-spray" id="btn-spray" onclick="setMode('spray')">💨 Спрей</button>
    <button class="btn btn-magnet" id="btn-magnet" onclick="setMode('magnet')">🧲 Магнит</button>
    <button class="btn" onclick="spawnFly()">🪰 +1 Муха</button>
    <button class="btn" onclick="resetSim()">🔄 Сброс</button>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    let scene, camera, renderer, clock;
    let flies = [];
    let currentMode = 'touch';
    let pointerPos = new THREE.Vector3();
    let effectParticles = null;

    function init() {
      const container = document.getElementById('canvas-container');
      clock = new THREE.Clock();

      scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x08090d, 0.04);

      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 0, 7);

      renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      container.appendChild(renderer.domElement);

      // Освещение (Студийный свет)
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
      scene.add(ambientLight);

      const mainLight = new THREE.DirectionalLight(0xffffff, 1.2);
      mainLight.position.set(5, 8, 5);
      scene.add(mainLight);

      const redRimLight = new THREE.PointLight(0xff2200, 1.5, 10);
      redRimLight.position.set(-4, -2, -2);
      scene.add(redRimLight);

      // Спавним главную муху
      spawnFly();

      window.addEventListener('pointerdown', handlePointer);
      window.addEventListener('pointermove', (e) => { if (e.buttons > 0) handlePointer(e); });
      window.addEventListener('resize', onWindowResize);

      animate();
    }

    // Создание детализированной модели мухи
    function buildDetailedFly() {
      const flyGroup = new THREE.Group();

      // Материалы
      const bodyMat = new THREE.MeshStandardMaterial({ color: 0x151518, roughness: 0.3, metalness: 0.8 });
      const eyeMat = new THREE.MeshStandardMaterial({ color: 0x880000, roughness: 0.1, metalness: 0.1 });
      const wingMat = new THREE.MeshPhysicalMaterial({
        color: 0xffffff, transmission: 0.9, opacity: 1, transparent: true, roughness: 0.1, ior: 1.5
      });

      // Брюшко
      const abdomen = new THREE.Mesh(new THREE.ConeGeometry(0.45, 0.9, 16), bodyMat);
      abdomen.rotation.x = -Math.PI / 2.2;
      abdomen.position.set(0, -0.1, -0.4);
      flyGroup.add(abdomen);

      // Грудь
      const thorax = new THREE.Mesh(new THREE.SphereGeometry(0.4, 16, 16), bodyMat);
      thorax.scale.set(0.9, 0.8, 1.1);
      flyGroup.add(thorax);

      // Голова
      const head = new THREE.Mesh(new THREE.SphereGeometry(0.28, 16, 16), bodyMat);
      head.position.set(0, 0.05, 0.42);
      flyGroup.add(head);

      // Фасеточные глаза
      const eyeGeo = new THREE.SphereGeometry(0.18, 12, 12);
      const leftEye = new THREE.Mesh(eyeGeo, eyeMat);
      leftEye.position.set(-0.2, 0.12, 0.48);
      const rightEye = leftEye.clone();
      rightEye.position.x = 0.2;
      flyGroup.add(leftEye);
      flyGroup.add(rightEye);

      // Крылья
      const wingShape = new THREE.Shape();
      wingShape.moveTo(0, 0);
      wingShape.bezierCurveTo(0.2, 0.5, 0.4, 0.9, 0.1, 1.3);
      wingShape.bezierCurveTo(-0.2, 1.1, -0.3, 0.5, 0, 0);

      const wingExtrude = new THREE.ShapeGeometry(wingShape);
      const leftWing = new THREE.Mesh(wingExtrude, wingMat);
      leftWing.position.set(-0.15, 0.25, -0.1);
      leftWing.rotation.x = Math.PI / 2;
      leftWing.rotation.y = -Math.PI / 6;

      const rightWing = leftWing.clone();
      rightWing.position.x = 0.15;
      rightWing.rotation.y = Math.PI / 6;

      flyGroup.add(leftWing);
      flyGroup.add(rightWing);

      return {
        mesh: flyGroup,
        leftWing: leftWing,
        rightWing: rightWing,
        pos: new THREE.Vector3(0, 0, 0),
        vel: new THREE.Vector3(),
        hp: 100,
        isShocked: false,
        shockTimer: 0
      };
    }

    function spawnFly() {
      const flyData = buildDetailedFly();
      flyData.pos.set((Math.random() - 0.5) * 3, (Math.random() - 0.5) * 3, 0);
      scene.add(flyData.mesh);
      flies.push(flyData);
    }

    function setMode(mode) {
      currentMode = mode;
      document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
      document.getElementById(`btn-${mode}`).classList.add('active');
    }

    function handlePointer(e) {
      if (e.clientY > window.innerHeight - 70) return;

      const vec = new THREE.Vector3(
        (e.clientX / window.innerWidth) * 2 - 1,
        -(e.clientY / window.innerHeight) * 2 + 1, 0.5
      );
      vec.unproject(camera);
      const dir = vec.sub(camera.position).normalize();
      const dist = -camera.position.z / dir.z;
      pointerPos = camera.position.clone().add(dir.multiplyScalar(dist));

      flies.forEach(fly => {
        const d = fly.pos.distanceTo(pointerPos);

        if (currentMode === 'touch' && d < 2.0) {
          // Отталкивание
          const force = fly.pos.clone().sub(pointerPos).normalize().multiplyScalar(5.0);
          fly.vel.add(force);
        } else if (currentMode === 'shock' && d < 2.5) {
          // Удар током
          fly.isShocked = true;
          fly.shockTimer = 1.5;
          fly.hp -= 15;
          createLightning(pointerPos, fly.pos);
        } else if (currentMode === 'spray' && d < 3.0) {
          // Травля спреем
          fly.hp -= 0.8;
          fly.vel.add(new THREE.Vector3((Math.random()-0.5)*0.5, -0.5, 0));
        } else if (currentMode === 'magnet') {
          // Магнитная аномалия
          const pull = pointerPos.clone().sub(fly.pos).normalize().multiplyScalar(3.0);
          fly.vel.add(pull);
        }
      });
    }

    function createLightning(p1, p2) {
      if (effectParticles) scene.remove(effectParticles);
      const geo = new THREE.BufferGeometry();
      const points = [p1, new THREE.Vector3().addVectors(p1, p2).multiplyScalar(0.5).add(new THREE.Vector3((Math.random()-0.5), (Math.random()-0.5), 0)), p2];
      geo.setFromPoints(points);
      const mat = new THREE.LineBasicMaterial({ color: 0x00ffff, linewidth: 3 });
      effectParticles = new THREE.Line(geo, mat);
      scene.add(effectParticles);
      setTimeout(() => { if (effectParticles) scene.remove(effectParticles); }, 100);
    }

    function resetSim() {
      flies.forEach(f => scene.remove(f.mesh));
      flies = [];
      spawnFly();
    }

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      const time = clock.getElapsedTime();

      flies.forEach((fly, index) => {
        if (fly.hp <= 0) {
          // Мертвая муха падает вниз
          fly.vel.y = -4.0;
          fly.mesh.rotation.x = Math.PI;
        } else if (fly.isShocked) {
          // Судороги от тока
          fly.shockTimer -= delta;
          fly.mesh.rotation.z += (Math.random() - 0.5) * 1.5;
          fly.mesh.rotation.x += (Math.random() - 0.5) * 1.5;
          if (fly.shockTimer <= 0) fly.isShocked = false;
        } else {
          // Естественный полет
          fly.vel.x += Math.sin(time * 4 + index) * 0.1;
          fly.vel.y += Math.cos(time * 3 + index) * 0.1;
          fly.vel.multiplyScalar(0.94); // Трение

          // Махи крыльев
          const wingSpeed = 40 + fly.vel.length() * 15;
          fly.leftWing.rotation.z = Math.sin(time * wingSpeed) * 0.5;
          fly.rightWing.rotation.z = -Math.sin(time * wingSpeed) * 0.5;

          // Поворот по движению
          if (fly.vel.length() > 0.1) {
            fly.mesh.rotation.z = -Math.atan2(fly.vel.x, fly.vel.y);
          }
        }

        fly.pos.add(fly.vel.clone().multiplyScalar(delta));
        
        // Ограничение стенками
        fly.pos.x = THREE.MathUtils.clamp(fly.pos.x, -3.8, 3.8);
        fly.pos.y = THREE.MathUtils.clamp(fly.pos.y, -2.8, 2.8);
        
        fly.mesh.position.copy(fly.pos);
      });

      if (flies.length > 0) {
        document.getElementById('status').innerText = 
          `🧠 МУХ В СЦЕНЕ: ${flies.length} | HP ГЛАВНОЙ: ${Math.max(0, Math.round(flies[0].hp))}%`;
      }
      
      renderer.render(scene, camera);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    window.onload = init;
  </script>
</body>
</html>
