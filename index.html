<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>FlyWire STDP 3D Simulator</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; overflow: hidden; background: #020617; font-family: -apple-system, BlinkMacSystemFont, monospace; color: #38bdf8; user-select: none; }
    #canvas-container { width: 100vw; height: 100vh; touch-action: none; }
    
    #telemetry {
      position: absolute; top: 12px; left: 12px; z-index: 100;
      background: rgba(15, 23, 42, 0.85); padding: 14px; border-radius: 16px;
      border: 1px solid rgba(56, 189, 248, 0.25); font-size: 11px; line-height: 1.5;
      max-width: 310px; pointer-events: none; backdrop-filter: blur(12px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6);
    }

    .meter-bar { width: 100%; background: rgba(2, 6, 23, 0.9); height: 6px; border-radius: 3px; margin: 2px 0 6px; overflow: hidden; border: 1px solid rgba(255,255,255,0.05); }
    .meter-fill { height: 100%; background: linear-gradient(90deg, #0284c7, #38bdf8); width: 0%; transition: width 0.1s; }

    #ui-container {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      display: flex; gap: 8px; z-index: 100; padding: 6px;
      background: rgba(15, 23, 42, 0.85); border-radius: 16px;
      border: 1px solid rgba(56, 189, 248, 0.25); backdrop-filter: blur(12px);
    }
    .btn {
      background: rgba(30, 41, 59, 0.7); border: 1px solid rgba(56, 189, 248, 0.3); color: #f8fafc;
      padding: 10px 14px; border-radius: 10px; font-weight: 600; font-size: 11px;
      cursor: pointer; transition: all 0.2s;
    }
    .btn.active { background: #0284c7; border-color: #38bdf8; box-shadow: 0 0 12px rgba(2, 132, 199, 0.6); }
  </style>
</head>
<body>

  <div id="telemetry">
    <div style="font-size: 12px; font-weight: bold; color: #fff; margin-bottom: 4px;">🧠 STDP & CPG SNN ENGINE</div>
    <div style="opacity: 0.6; font-size: 9px; margin-bottom: 8px;">LAYERING + AERODYNAMIC 3D FLIGHT</div>
    
    ⚡ Спайков/сек: <b id="spike-rate" style="color:#38bdf8;">0</b><br>
    🧬 Пластичность (STDP): <b id="stdp-rate" style="color:#22c55e;">Active</b><br>
    
    👁 Optic Lobe L/R:
    <div class="meter-bar"><div id="eye-fill" class="meter-fill"></div></div>
    
    🛸 Central Complex (CX):
    <div class="meter-bar"><div id="cx-fill" class="meter-fill" style="background: linear-gradient(90deg, #e11d48, #fb7185);"></div></div>

    🪽 Моторная тяга (L/R):
    <div class="meter-bar"><div id="motor-fill" class="meter-fill" style="background:#0284c7;"></div></div>

    📍 Полётная физика: <span id="brain-status" style="color:#38bdf8; font-weight:bold;">Airborne (CPG)</span>
  </div>

  <div id="canvas-container"></div>

  <div id="ui-container">
    <button class="btn active" id="btn-food" onclick="selectTool('food')">🍕 Сахар</button>
    <button class="btn" id="btn-threat" onclick="selectTool('threat')">💥 Опасность</button>
    <button class="btn" id="btn-wall" onclick="selectTool('wall')">🧱 Барьер</button>
    <button class="btn" onclick="clearObjects()">🧹 Очистить</button>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    let scene, camera, renderer, clock;
    let flyMesh, leftWing, rightWing;
    let brainHologram, brainParticles, brainGeo;
    let floorPlane, raycaster, mouse = new THREE.Vector2();
    let objects = []; 
    let currentTool = 'food';

    // Векторные переменные полёта
    let flyPos = new THREE.Vector3(0, 2.0, 0);
    let flyVel = new THREE.Vector3(0, 0, 0);
    let flyRotY = 0, flyPitch = 0, flyRoll = 0;

    let isDragging = false, prevMouseX = 0, prevMouseY = 0;
    let camRadius = 11, camTheta = Math.PI / 4, camPhi = Math.PI / 3;

    // ==========================================
    // 🧠 ADVANCED LAYERED SNN + STDP ENGINE
    // ==========================================
    const TOTAL_NEURONS = 100000;
    const SYNAPSE_COUNT = 400000;

    // Слои коннектома
    const SENSORY_L     = 0;      // 0..4999 (Optic Lobe Left)
    const SENSORY_R     = 5000;   // 5000..9999 (Optic Lobe Right)
    const CENTRAL_CX    = 10000;  // 10000..69999 (Central Complex - Навигация/Память)
    const CPG_PACEMAKER = 70000;  // 70000..79999 (Central Pattern Generator)
    const MOTOR_L       = 80000;  // 80000..89999 (VNC Left Wing Motor)
    const MOTOR_R       = 90000;  // 90000..99999 (VNC Right Wing Motor)

    const V_REST = -70.0, V_THRESH = -50.0, V_RESET = -75.0, DECAY = 0.85;

    let V = new Float32Array(TOTAL_NEURONS);
    let I_ext = new Float32Array(TOTAL_NEURONS);
    let lastSpikeTime = new Float32Array(TOTAL_NEURONS);
    
    let synFrom = new Int32Array(SYNAPSE_COUNT);
    let synTo = new Int32Array(SYNAPSE_COUNT);
    let synWeight = new Float32Array(SYNAPSE_COUNT);

    let spikeCountOptic = 0, spikeCountCX = 0;
    let spikeCountMotorL = 0, spikeCountMotorR = 0;

    function initLayeredConnectome() {
      for (let k = 0; k < SYNAPSE_COUNT; k++) {
        let src = 0, dst = 0;
        let layerType = Math.random();

        if (layerType < 0.4) {
          // Сетчатка -> Центральный Комплекс
          src = Math.floor(Math.random() * 10000);
          dst = CENTRAL_CX + Math.floor(Math.random() * 60000);
        } else if (layerType < 0.7) {
          // Центральный Комплекс -> Моторы
          src = CENTRAL_CX + Math.floor(Math.random() * 60000);
          dst = MOTOR_L + Math.floor(Math.random() * 20000);
        } else {
          // CPG Пейсмейкер -> Моторы
          src = CPG_PACEMAKER + Math.floor(Math.random() * 10000);
          dst = MOTOR_L + Math.floor(Math.random() * 20000);
        }

        synFrom[k] = src;
        synTo[k] = dst;
        synWeight[k] = (Math.random() - 0.2) * 2.0;
      }

      for (let i = 0; i < TOTAL_NEURONS; i++) {
        V[i] = V_REST;
        lastSpikeTime[i] = -999;
      }
    }

    function stepSNN(currentTime) {
      spikeCountOptic = 0; spikeCountCX = 0;
      spikeCountMotorL = 0; spikeCountMotorR = 0;
      let totalSpikes = 0;

      // CPG Пейсмейкер: генерирует базовый тонус полёта
      let cpgSignal = Math.sin(currentTime * 30.0) > 0.2 ? 15.0 : 0;
      for (let i = CPG_PACEMAKER; i < CPG_PACEMAKER + 2000; i += 5) {
        I_ext[i] += cpgSignal;
      }

      // LIF интеграция
      for (let i = 0; i < TOTAL_NEURONS; i++) {
        V[i] = V_REST + (V[i] - V_REST) * DECAY + I_ext[i];
        I_ext[i] = 0;
      }

      // Генерация спайков
      for (let i = 0; i < TOTAL_NEURONS; i++) {
        if (V[i] >= V_THRESH) {
          V[i] = V_RESET;
          lastSpikeTime[i] = currentTime;
          totalSpikes++;

          if (i < CENTRAL_CX) spikeCountOptic++;
          else if (i < CPG_PACEMAKER) spikeCountCX++;
          else if (i >= MOTOR_L && i < MOTOR_R) spikeCountMotorL++;
          else if (i >= MOTOR_R) spikeCountMotorR++;
        }
      }

      // Передача импульсов и STDP Пластичность
      for (let k = 0; k < SYNAPSE_COUNT; k++) {
        let src = synFrom[k];
        let dst = synTo[k];

        if (V[src] === V_RESET) {
          I_ext[dst] += synWeight[k];

          // STDP Обучение: укрепление синапса (LTP) при корреляции
          let dt = currentTime - lastSpikeTime[dst];
          if (dt > 0 && dt < 0.02) {
            synWeight[k] = Math.min(5.0, synWeight[k] + 0.05);
          }
        }
      }

      return totalSpikes;
    }

    function selectTool(tool) {
      currentTool = tool;
      document.querySelectorAll('#ui-container .btn').forEach(b => b.classList.remove('active'));
      document.getElementById(`btn-${tool}`).classList.add('active');
    }

    // ==========================================
    // 🎨 3D СЦЕНА И ГОЛОГРАФИЧЕСКИЙ МОЗГ
    // ==========================================
    function init() {
      const container = document.getElementById('canvas-container');
      clock = new THREE.Clock();
      raycaster = new THREE.Raycaster();

      scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x020617, 0.035);

      camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 1000);
      updateCameraPosition();

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      container.appendChild(renderer.domElement);

      scene.add(new THREE.AmbientLight(0x1e293b, 1.2));

      const dirLight = new THREE.DirectionalLight(0x38bdf8, 2.2);
      dirLight.position.set(10, 20, 10);
      dirLight.castShadow = true;
      dirLight.shadow.mapSize.width = 2048;
      dirLight.shadow.mapSize.height = 2048;
      scene.add(dirLight);

      // Пол
      const floorMat = new THREE.MeshStandardMaterial({ color: 0x030712, roughness: 0.5, metalness: 0.4 });
      floorPlane = new THREE.Mesh(new THREE.PlaneGeometry(32, 32), floorMat);
      floorPlane.rotation.x = -Math.PI / 2;
      floorPlane.receiveShadow = true;
      scene.add(floorPlane);

      const grid = new THREE.GridHelper(32, 32, 0x0284c7, 0x0f172a);
      grid.position.y = 0.01;
      scene.add(grid);

      buildDetailedFly();
      build3DBrainHologram();
      initLayeredConnectome();

      spawnObject('food', new THREE.Vector3(3, 0, 3));
      spawnObject('threat', new THREE.Vector3(-3, 0, -2));

      container.addEventListener('pointerdown', onPointerDown);
      container.addEventListener('pointermove', onPointerMove);
      container.addEventListener('pointerup', () => isDragging = false);
      window.addEventListener('resize', onWindowResize);

      animate();
    }

    function buildDetailedFly() {
      const group = new THREE.Group();
      const bodyMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.2, metalness: 0.8 });
      const eyeMat = new THREE.MeshStandardMaterial({ color: 0xd97706, roughness: 0.1, metalness: 0.3 });
      const wingMat = new THREE.MeshPhysicalMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.6, transmission: 0.8 });

      const thorax = new THREE.Mesh(new THREE.SphereGeometry(0.32, 16, 16), bodyMat);
      thorax.scale.set(0.85, 0.75, 1.1);
      thorax.castShadow = true;
      group.add(thorax);

      const abdomen = new THREE.Mesh(new THREE.SphereGeometry(0.4, 16, 16), bodyMat);
      abdomen.position.set(0, -0.05, -0.6);
      abdomen.scale.set(0.8, 0.7, 1.4);
      abdomen.castShadow = true;
      group.add(abdomen);

      const eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.15, 12, 12), eyeMat);
      eyeL.position.set(-0.16, 0.08, 0.25);
      const eyeR = eyeL.clone(); eyeR.position.x = 0.16;
      group.add(eyeL); group.add(eyeR);

      const wingGeo = new THREE.BoxGeometry(0.45, 0.005, 0.8);
      wingGeo.translate(0.22, 0, -0.35);
      leftWing = new THREE.Mesh(wingGeo, wingMat);
      leftWing.position.set(-0.08, 0.2, -0.1);
      rightWing = new THREE.Mesh(wingGeo, wingMat);
      rightWing.position.set(0.08, 0.2, -0.1);
      rightWing.scale.x = -1;

      group.add(leftWing); group.add(rightWing);
      flyMesh = group;
      scene.add(flyMesh);
    }

    // 3D Голограмма Мозга над мухой
    function build3DBrainHologram() {
      brainHologram = new THREE.Group();
      const count = 300;
      const positions = new Float32Array(count * 3);
      const colors = new Float32Array(count * 3);

      for (let i = 0; i < count; i++) {
        positions[i*3]     = (Math.random() - 0.5) * 0.8;
        positions[i*3 + 1] = (Math.random() - 0.5) * 0.5;
        positions[i*3 + 2] = (Math.random() - 0.5) * 0.6;

        colors[i*3]     = 0.2;
        colors[i*3 + 1] = 0.7;
        colors[i*3 + 2] = 1.0;
      }

      brainGeo = new THREE.BufferGeometry();
      brainGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      brainGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

      const mat = new THREE.PointsMaterial({ size: 0.04, vertexColors: true, transparent: true, opacity: 0.8 });
      brainParticles = new THREE.Points(brainGeo, mat);
      
      brainHologram.add(brainParticles);
      scene.add(brainHologram);
    }

    function spawnObject(type, pos) {
      const parentGroup = new THREE.Group();
      parentGroup.position.copy(pos);

      if (type === 'food') {
        const crystalMat = new THREE.MeshStandardMaterial({ color: 0x22c55e, roughness: 0.1, emissive: 0x15803d, emissiveIntensity: 0.4 });
        for (let i = 0; i < 4; i++) {
          const m = new THREE.Mesh(new THREE.DodecahedronGeometry(0.25), crystalMat);
          m.position.set((Math.random() - 0.5) * 0.3, 0.2 + i * 0.15, (Math.random() - 0.5) * 0.3);
          m.castShadow = true;
          parentGroup.add(m);
        }
      } else if (type === 'threat') {
        const coreMat = new THREE.MeshStandardMaterial({ color: 0xef4444, emissive: 0xd97706, emissiveIntensity: 0.8 });
        const core = new THREE.Mesh(new THREE.IcosahedronGeometry(0.35, 0), coreMat);
        core.position.y = 0.4;
        core.castShadow = true;
        parentGroup.add(core);
      } else {
        const wallMat = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.4 });
        const wall = new THREE.Mesh(new THREE.BoxGeometry(2.5, 1.2, 0.3), wallMat);
        wall.position.y = 0.6;
        wall.castShadow = true;
        parentGroup.add(wall);
      }

      parentGroup.userData = { type: type };
      scene.add(parentGroup);
      objects.push(parentGroup);
    }

    function clearObjects() {
      objects.forEach(obj => scene.remove(obj));
      objects = [];
    }

    function onPointerDown(e) {
      isDragging = true;
      prevMouseX = e.clientX; prevMouseY = e.clientY;

      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);

      const intersects = raycaster.intersectObject(floorPlane);
      if (intersects.length > 0 && e.clientY < window.innerHeight - 80) {
        spawnObject(currentTool, intersects[0].point);
      }
    }

    function onPointerMove(e) {
      if (!isDragging) return;
      let deltaX = e.clientX - prevMouseX;
      let deltaY = e.clientY - prevMouseY;
      if (Math.abs(deltaX) > 2 || Math.abs(deltaY) > 2) {
        camTheta -= deltaX * 0.005;
        camPhi = Math.max(0.2, Math.min(Math.PI / 2 - 0.05, camPhi - deltaY * 0.005));
        prevMouseX = e.clientX; prevMouseY = e.clientY;
        updateCameraPosition();
      }
    }

    function updateCameraPosition() {
      camera.position.x = flyPos.x + camRadius * Math.sin(camPhi) * Math.cos(camTheta);
      camera.position.y = flyPos.y + camRadius * Math.cos(camPhi);
      camera.position.z = flyPos.z + camRadius * Math.sin(camPhi) * Math.sin(camTheta);
      camera.lookAt(flyPos.x, flyPos.y + 0.2, flyPos.z);
    }

    // ==========================================
    // 🔄 3D АЭРОДИНАМИЧЕСКИЙ ЦИКЛ ПОЛЁТА
    // ==========================================
    function animate() {
      requestAnimationFrame(animate);
      const delta = Math.min(clock.getDelta(), 0.05);
      const time = clock.getElapsedTime();

      // Зрение
      let flyDir = new THREE.Vector3(Math.sin(flyRotY), 0, Math.cos(flyRotY));
      objects.forEach(obj => {
        let toObj = new THREE.Vector3().subVectors(obj.position, flyPos);
        let dist = toObj.length();
        if (dist < 7.0) {
          let stim = (7.0 - dist) * 2.0;
          if (obj.userData.type === 'threat') stim *= -2.0;
          for (let i = 0; i < 5000; i += 20) I_ext[i] += stim;
        }
      });

      // Шаг SNN
      let totalSpikes = stepSNN(time);

      // Аэродинамика полета на основе спайков моторов
      let thrustL = spikeCountMotorL * 0.008;
      let thrustR = spikeCountMotorR * 0.008;

      // Рыскание (Yaw) и Подъемная сила (Lift)
      flyRotY += (thrustL - thrustR) * 0.8;
      let totalLift = (thrustL + thrustR) * 0.5;

      // Скорость и инерция
      let forwardThrust = Math.max(0.02, totalLift);
      flyVel.x += Math.sin(flyRotY) * forwardThrust * delta * 10;
      flyVel.z += Math.cos(flyRotY) * forwardThrust * delta * 10;
      flyVel.y += (totalLift - 0.08) * delta * 5; // Гравитация vs Подъёмная сила

      flyVel.multiplyScalar(0.92); // Сопротивление воздуха
      flyPos.add(flyVel);

      // Ограничения по высоте и границам
      flyPos.y = Math.max(0.4, Math.min(6.0, flyPos.y));
      flyPos.x = Math.max(-14, Math.min(14, flyPos.x));
      flyPos.z = Math.max(-14, Math.min(14, flyPos.z));

      // Крен (Roll) и Тангаж (Pitch)
      flyRoll = (thrustR - thrustL) * 2.0;
      flyPitch = -flyVel.y * 1.5;

      flyMesh.position.copy(flyPos);
      flyMesh.rotation.set(flyPitch, flyRotY, flyRoll);

      // Анимация крыльев
      let wingFreq = 20 + totalLift * 100;
      leftWing.rotation.y = Math.sin(time * wingFreq) * 0.5;
      rightWing.rotation.y = -Math.sin(time * wingFreq) * 0.5;

      // Голограмма мозга над мухой
      brainHologram.position.copy(flyPos);
      brainHologram.position.y += 0.9;
      brainHologram.rotation.y = time * 0.5;

      updateCameraPosition();

      // UI
      document.getElementById('spike-rate').innerText = totalSpikes.toLocaleString();
      document.getElementById('eye-fill').style.width = `${Math.min(100, spikeCountOptic / 10)}%`;
      document.getElementById('cx-fill').style.width = `${Math.min(100, spikeCountCX / 20)}%`;
      document.getElementById('motor-fill').style.width = `${Math.min(100, (spikeCountMotorL + spikeCountMotorR) / 2)}%`;

      renderer.render(scene, camera);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    window.onload = init;
  </script>
</body>
</html>
