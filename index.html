<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Connectome Spiking Fly Neural Net</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { margin: 0; overflow: hidden; background: #020617; font-family: monospace; color: #38bdf8; user-select: none; }
    #canvas-container { width: 100vw; height: 100vh; touch-action: none; }
    
    #telemetry {
      position: absolute; top: 10px; left: 10px; z-index: 100;
      background: rgba(2, 6, 23, 0.9); padding: 12px; border-radius: 10px;
      border: 1px solid #1e293b; font-size: 11px; line-height: 1.4;
      max-width: 280px; pointer-events: none; backdrop-filter: blur(8px);
    }

    #ui-container {
      position: absolute; bottom: 16px; left: 0; width: 100vw;
      display: flex; justify-content: center; z-index: 100;
    }
    .btn {
      background: #0f172a; border: 1px solid #0284c7; color: #38bdf8;
      padding: 12px 20px; border-radius: 12px; font-weight: bold; font-size: 13px;
      cursor: pointer; transition: 0.1s;
    }
    .btn:active { transform: scale(0.95); background: #0284c7; color: white; }
  </style>
</head>
<body>

  <div id="telemetry">
    ⚙️ <b>FLYWIRE CONNECTOME SNN</b><br>
    -------------------------<br>
    🧠 Активные нейроны: <span id="net-count">0</span><br>
    ⚡ Спайков/сек (Hz): <span id="spike-rate">0</span><br>
    👁️ Sensory (L / R): <span id="sensory-val">0 / 0</span> mV<br>
    🍗 Motor Wings Spike: <span id="motor-val">OFF</span><br>
    📍 Статус: <span id="brain-status">Инициализация...</span>
  </div>

  <div id="canvas-container"></div>

  <div id="ui-container">
    <button class="btn" onclick="resetBrain()">⚡ Сбросить потенциал мембран</button>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    let scene, camera, renderer, clock;
    let flyMesh, leftWing, rightWing;
    let pointerPos = new THREE.Vector3();
    let flyPos = new THREE.Vector3(0, 0, 0);
    let flyVel = new THREE.Vector3(0, 0, 0);

    // ==========================================
    // 🧠 УВЕЛИЧЕННАЯ НЕЙРОСЕТЬ SNN (512 НЕЙРОНОВ)
    // ==========================================
    const NUM_SENSORY = 120;  // Фасетки глаз (Optic Lobe)
    const NUM_INTER = 380;    // Главные интернейроны (Lobula Plate & Central Complex)
    const NUM_MOTOR = 12;     // Моторные нейроны крыльев и ориентации
    const TOTAL_NEURONS = NUM_SENSORY + NUM_INTER + NUM_MOTOR;

    const V_REST = -70.0;
    const V_THRESH = -50.0;
    const V_RESET = -75.0;
    const DECAY = 0.85;

    let V = new Float32Array(TOTAL_NEURONS);
    let I_ext = new Float32Array(TOTAL_NEURONS);
    let W = [];
    let totalSpikes = 0;
    let motorSpikeActive = false;

    function initConnectomeWeights() {
      W = Array.from({ length: TOTAL_NEURONS }, () => new Float32Array(TOTAL_NEURONS));

      // Глаза -> Интернейроны
      for (let i = 0; i < NUM_SENSORY; i++) {
        for (let j = NUM_SENSORY; j < NUM_SENSORY + NUM_INTER; j++) {
          if (Math.random() < 0.15) { // 15% плотность синапсов
            W[i][j] = Math.random() * 6.0 + 1.0;
          }
        }
      }

      // Внутренние связи слоёв мозга
      for (let i = NUM_SENSORY; i < NUM_SENSORY + NUM_INTER; i++) {
        for (let j = NUM_SENSORY; j < NUM_SENSORY + NUM_INTER; j++) {
          if (i !== j && Math.random() < 0.08) {
            W[i][j] = (Math.random() - 0.45) * 4.0;
          }
        }
      }

      // Интернейроны -> Моторная кора
      for (let i = NUM_SENSORY; i < NUM_SENSORY + NUM_INTER; i++) {
        for (let m = 0; m < NUM_MOTOR; m++) {
          if (Math.random() < 0.2) {
            W[i][NUM_SENSORY + NUM_INTER + m] = Math.random() * 8.0 + 2.0;
          }
        }
      }

      for (let i = 0; i < TOTAL_NEURONS; i++) V[i] = V_REST;
    }

    function updateSNN(dt) {
      let currentSpikes = 0;
      motorSpikeActive = false;

      for (let i = 0; i < TOTAL_NEURONS; i++) {
        V[i] = V_REST + (V[i] - V_REST) * DECAY + I_ext[i];
        I_ext[i] = 0;
      }

      for (let i = 0; i < TOTAL_NEURONS; i++) {
        if (V[i] >= V_THRESH) {
          V[i] = V_RESET;
          currentSpikes++;

          for (let j = 0; j < TOTAL_NEURONS; j++) {
            if (W[i][j] !== 0) I_ext[j] += W[i][j];
          }

          if (i >= NUM_SENSORY + NUM_INTER) {
            motorSpikeActive = true;
          }
        }
      }

      totalSpikes += currentSpikes;
      return currentSpikes;
    }

    function resetBrain() {
      for (let i = 0; i < TOTAL_NEURONS; i++) V[i] = V_REST;
      flyPos.set(0, 0, 0);
      flyVel.set(0, 0, 0);
      document.getElementById('brain-status').innerText = 'Сброшен!';
    }

    // ==========================================
    // 🎨 3D ГРАФИКА
    // ==========================================
    function init() {
      const container = document.getElementById('canvas-container');
      clock = new THREE.Clock();

      scene = new THREE.Scene();
      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 0, 8);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      container.appendChild(renderer.domElement);

      scene.add(new THREE.AmbientLight(0x38bdf8, 0.6));
      const light = new THREE.DirectionalLight(0xffffff, 1.2);
      light.position.set(5, 10, 7);
      scene.add(light);

      buildFlyMesh();
      initConnectomeWeights();

      document.getElementById('net-count').innerText = TOTAL_NEURONS;

      container.addEventListener('pointermove', handlePointer);
      container.addEventListener('pointerdown', handlePointer);
      window.addEventListener('resize', onWindowResize);

      animate();
    }

    function buildFlyMesh() {
      const flyGroup = new THREE.Group();
      const bodyMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.4 });
      const eyeMat = new THREE.MeshStandardMaterial({ color: 0xef4444 });
      const wingMat = new THREE.MeshPhysicalMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.6 });

      const body = new THREE.Mesh(new THREE.SphereGeometry(0.4, 12, 12), bodyMat);
      body.scale.set(0.8, 0.7, 1.2);
      flyGroup.add(body);

      const eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.15, 10, 10), eyeMat);
      eyeL.position.set(-0.18, 0.08, 0.35);
      const eyeR = eyeL.clone();
      eyeR.position.x = 0.18;
      flyGroup.add(eyeL); flyGroup.add(eyeR);

      const wingGeo = new THREE.BoxGeometry(0.5, 0.01, 0.8);
      wingGeo.translate(0.25, 0, -0.3);
      leftWing = new THREE.Mesh(wingGeo, wingMat);
      leftWing.position.set(-0.08, 0.2, 0);
      rightWing = new THREE.Mesh(wingGeo, wingMat);
      rightWing.position.set(0.08, 0.2, 0);
      rightWing.scale.x = -1;

      flyGroup.add(leftWing); flyGroup.add(rightWing);
      flyMesh = flyGroup;
      scene.add(flyMesh);
    }

    function handlePointer(e) {
      const vec = new THREE.Vector3(
        (e.clientX / window.innerWidth) * 2 - 1,
        -(e.clientY / window.innerHeight) * 2 + 1, 0.5
      );
      vec.unproject(camera);
      const dir = vec.sub(camera.position).normalize();
      const dist = -camera.position.z / dir.z;
      pointerPos = camera.position.clone().add(dir.multiplyScalar(dist));
    }

    function getScreenBounds() {
      const vFOV = THREE.MathUtils.degToRad(camera.fov);
      const height = 2 * Math.tan(vFOV / 2) * camera.position.z;
      const width = height * camera.aspect;
      return { x: (width / 2) - 0.5, y: (height / 2) - 0.8 };
    }

    function animate() {
      requestAnimationFrame(animate);
      const delta = Math.min(clock.getDelta(), 0.1);
      const time = clock.getElapsedTime();

      const bounds = getScreenBounds();

      // Стимуляция сенсорных нейронов глаз
      const distToPointer = flyPos.distanceTo(pointerPos);
      let leftSensoryCurrent = 0, rightSensoryCurrent = 0;

      if (distToPointer < 3.0) {
        const stimulation = (3.0 - distToPointer) * 10.0;
        leftSensoryCurrent = stimulation;
        rightSensoryCurrent = stimulation;

        for (let i = 0; i < NUM_SENSORY / 2; i++) I_ext[i] += leftSensoryCurrent;
        for (let i = NUM_SENSORY / 2; i < NUM_SENSORY; i++) I_ext[i] += rightSensoryCurrent;
      }

      // Если близко к краю — подаём сигналы в нейроны разворота
      if (Math.abs(flyPos.x) > bounds.x * 0.7 || Math.abs(flyPos.y) > bounds.y * 0.7) {
        for (let i = 0; i < NUM_SENSORY; i++) I_ext[i] += 4.0;
      }

      const spikesCount = updateSNN(delta);

      // Реакция на движения
      if (motorSpikeActive) {
        const escapeDir = flyPos.clone().sub(pointerPos).normalize();
        flyVel.add(escapeDir.multiplyScalar(2.5 * delta)); // Умеренная скорость
        
        leftWing.rotation.y = Math.sin(time * 50) * 0.6;
        rightWing.rotation.y = -Math.sin(time * 50) * 0.6;
        document.getElementById('brain-status').innerText = '⚠️️ РЕФЛЕКС ВЗЛЁТА!';
      } else {
        // Плавающий пассивный полет
        flyVel.x += Math.sin(time * 2.5) * 0.015;
        flyVel.y += Math.cos(time * 2.0) * 0.015;
        flyVel.multiplyScalar(0.92); // Торможение
        
        leftWing.rotation.y = Math.sin(time * 12) * 0.2;
        rightWing.rotation.y = -Math.sin(time * 12) * 0.2;
        document.getElementById('brain-status').innerText = 'ПОКОЙ / ПОИСК';
      }

      // Твёрдые физические границы с мягким возвратом
      if (Math.abs(flyPos.x) > bounds.x) {
        flyPos.x = Math.sign(flyPos.x) * bounds.x;
        flyVel.x *= -0.3;
      }
      if (Math.abs(flyPos.y) > bounds.y) {
        flyPos.y = Math.sign(flyPos.y) * bounds.y;
        flyVel.y *= -0.3;
      }

      flyPos.add(flyVel);
      flyMesh.position.copy(flyPos);

      if (flyVel.length() > 0.005) {
        flyMesh.rotation.z = -Math.atan2(flyVel.x, flyVel.y);
      }

      // Обновление UI
      document.getElementById('spike-rate').innerText = spikesCount * 20;
      document.getElementById('sensory-val').innerText = `${leftSensoryCurrent.toFixed(1)} / ${rightSensoryCurrent.toFixed(1)}`;
      document.getElementById('motor-val').innerText = motorSpikeActive ? 'SPIKE' : 'IDLE';

      renderer.render(scene, camera);
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    window.onload = init;
  </script>
</body>
</html>
